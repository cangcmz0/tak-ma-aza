  #   KEYSTORE_BASE64     : upload keystore dosyasının base64 hali (base64 -w0 upload.jks)
  #   KEYSTORE_PASSWORD   : keystore şifresi
  #   KEY_ALIAS           : anahtar takma adı (ör. upload)
  #   KEY_PASSWORD        : anahtar şifresi
