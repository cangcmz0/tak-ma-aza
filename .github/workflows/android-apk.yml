# Kum Akışı — Android debug APK derleme hattı.
# Oyun projesi repo kökünde değil, game/ alt klasöründe; Android projesi game/android/.
# APK: Actions → ilgili çalışma → Artifacts → "kum-akisi-debug-apk" (ayrıntı: docs/release.md).
name: Android APK

on:
  push:
    branches:
      - main
      - 'ccr-*'
    paths:
      - 'game/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

# Aynı dala art arda push gelirse eski çalışmayı iptal et.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: game

    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: Node 22 kur
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Bağımlılıkları kur (npm ci)
        run: npm ci

      - name: Birim testleri (vitest)
        run: npm test

      - name: Web derlemesi (tsc + vite → dist/)
        run: npm run build

      - name: Capacitor sync (dist → android/app/src/main/assets/public)
        run: npx cap sync android

      # Capacitor 8 ve eklentileri Java 21 ile derlenir (sourceCompatibility = VERSION_21);
      # AGP 8.13 / Gradle 8.14 de JDK 21'i destekler.
      - name: Java 21 (Temurin) kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            game/android/*.gradle
            game/android/app/*.gradle
            game/android/gradle/wrapper/gradle-wrapper.properties

      # ubuntu-latest'te Android SDK hazır geliyor; bu adım lisansları kabul eder ve
      # sdkmanager'ı PATH'e koyar. Eksik platform/build-tools'u AGP derlemede kendisi indirir.
      - name: Android SDK hazırla
        uses: android-actions/setup-android@v4

      - name: Debug APK derle
        working-directory: game/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v6
        with:
          name: kum-akisi-debug-apk
          path: game/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
