<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Ses Laboratuvarı — Kum Akışı</title>
    <style>
      :root { --bg: #14112b; --panel: #221e45; --line: #36316e; --fg: #f3f0ff; --muted: #a8a2d6; --accent: #ffb547; color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 900px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 1.4rem; margin: 0 0 4px; }
      h2 { font-size: 1.05rem; margin: 24px 0 8px; color: var(--accent); }
      p.note { color: var(--muted); margin: 0 0 12px; }
      .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
      .controls label { display: flex; gap: 8px; align-items: center; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
      button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; text-align: left; padding: 8px 10px; cursor: pointer; }
      button:active { transform: scale(0.98); }
      button b { display: block; }
      button small { color: var(--muted); display: block; font-size: 0.8rem; }
      button.on { border-color: var(--accent); background: #3a2f1c; }
      #status { font-family: ui-monospace, monospace; font-size: 0.85rem; color: var(--muted); }
      #log { font-family: ui-monospace, monospace; font-size: 0.8rem; color: var(--muted); white-space: pre-wrap; max-height: 160px; overflow: auto; background: #0e0c20; border-radius: 8px; padding: 8px; }
    </style>
  </head>
  <body>
    <main id="lab"></main>
    <script type="module" src="/src/dev/soundLab.ts"></script>
  </body>
</html>
