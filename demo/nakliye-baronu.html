const fmtInt = n => (n < 0 ? '-' : '') + Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const tl = n => fmtInt(n) + ' ₺';

const tlk = n => { const a = Math.abs(n), s = n < 0 ? '-' : ''; if (a >= 1e9) return s + dec(a / 1e9, a >= 1e11 ? 0 : 2) + ' Mr ₺'; if (a >= 1e6) return s + dec(a / 1e6, 2) + ' Mn ₺'; return tl(n); };

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function erf(x){ const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return s * y; }
const Phi = z => 0.5 * (1 + erf(z / Math.SQRT2));
function randn(){ let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

    hatlar:Object.fromEntries((p.hat || []).map(id => { const h = HATLAR.find(x => x.id === id); return [id, {alis:h.fiyat * p.I * 0.75, deger:h.fiyat * p.I}]; })),

function log(t, k = 'not'){ S.log.unshift({g:S.gun, t, k}); if (S.log.length > 80) S.log.pop(); }
const adet = id => S.varlik[id] || 0;
function etki(k){ let t = 0; if (k === 'bonus') for (const h of HATLAR) if (S.hatlar[h.id]) t += h.bonus; for (const v of VARLIK) if (v[k] && adet(v.id) > 0) t += v[k]; for (const x of TEKNO) if (x[k] && S.tekno[x.id]) t += x[k]; for (const x of STATU) if (x[k] && S.statu[x.id]) t += x[k]; return t; }
const indirim = () => Math.min(0.25, etki('indirim'));
const riskAzalt = () => 1 - Math.min(0.4, etki('risk'));
function carpan(){ return (1 + S.itibar / 200) * (1 + 0.05 * S.yildiz) * (1 + etki('bonus')); }
function gelir(){ let t = 0; for (const v of VARLIK) t += adet(v.id) * v.gelir; return t * S.I * carpan(); }
function varlikGider(){ let t = 0; for (const v of VARLIK) t += adet(v.id) * v.gider; return t * S.I * (1 - indirim()); }
function agirlik(){ let w = 0; for (const v of VARLIK) w += adet(v.id) * Math.pow(v.fiyat / 9e5, 0.7); return w; }
const us = (m = S.mudur) => 1.15 - 0.015 * m;
const yonetim = (m = S.mudur) => (4000 + 800 * Math.pow(agirlik(), us(m))) * S.I * (1 - Math.min(0.4, etki('yonetim')));
const hatDeger = () => Object.values(S.hatlar).reduce((t, h) => t + h.deger, 0);
const yapimDeger = () => S.isler.filter(j => j.tur === 'insaat').reduce((t, j) => t + j.deger * S.I * 0.7, 0);
const aktifInsaat = () => S.isler.filter(j => j.tur === 'insaat').length;
const maxInsaat = () => 1 + Math.floor(S.cag / 2);
const mudurGider = (m = S.mudur) => m * 20000 * S.I;
const yillikEnf = () => Math.pow(1 + S.pi, 12) - 1;
const faizOrani = () => yillikEnf() + 0.08;

const netDeger = () => S.nakit + filoDeger() + yapimDeger() + hatDeger() + S.eur * S.kur - S.borc;
const reelND = () => netDeger() / S.I;

function tick(){

  const biten = S.isler.filter(j => j.kalan <= 0);

  biten.forEach(isiCoz);
  const esik = sonraki() ? sonraki().esik : HALKA_ARZ;

function isiCoz(j){
  if (j.tur === 'sefer'){
    if (Math.random() >= j.risk){
      const k = j.kar * j.base;
      S.nakit += j.avans + k; S.ayKar += k - (j.sigorta ? j.prim : 0); S.fail = 0;
      const d = S.soforler.find(x => x.id === j.sofor); let sv = '';
      if (d){ const once = soforSeviye(d); d.xp++; if (soforSeviye(d) > once) sv = ` ${d.ad} seviye ${soforSeviye(d)} oldu!`; }
      log(`${j.soforAd || 'Şoför'} teslim etti: ${j.ad} (${j.rota}) +${tlk(k)}.${sv}`, 'iyi'); toast(`Teslim edildi: +${tlk(k)}${sv}`);
    } else {
      S.fail++;
      const olay = (j.soforAd ? j.soforAd + ' ' : '') + pick(KAZA);
      if (j.sigorta){ S.nakit += j.avans; S.ayKar -= j.prim; log(`${j.ad}: ${olay}. Sigorta avansı karşıladı, kayıp sadece prim.`, 'kotu'); }
      else { const h = 0.5 * j.base; S.nakit -= h; S.ayKar -= j.avans + h; log(`${j.ad}: ${olay}. Kayıp: -${tlk(j.avans + h)}`, 'kotu'); }
      toast(`Sefer yattı: ${olay}`);
    }
  } else if (j.tur === 'insaat'){
    S.varlik[j.vid] = adet(j.vid) + j.n;
    log(`İnşaat tamamlandı: ${j.ad} hizmete girdi.`, 'iyi'); toast(`Açılış: ${j.ad}`);
  } else if (j.tur === 'ihale'){
    const f = j.b - j.M;
    S.nakit += f; S.ayKar += f;
    log(f >= 0 ? `İhale tamamlandı (${j.ad}): +${tlk(f)}` : `Kazananın laneti! ${j.ad} maliyeti aştı: ${tlk(f)}`, f >= 0 ? 'iyi' : 'kotu');
  } else if (j.tur === 'alacak'){
    if (Math.random() < 0.9) para(j.tutar, `${j.ad} tahsil edildi`);
    else log(`${j.ad}: müşteri konkordato ilan etti, alacak battı.`, 'kotu');
  } else if (j.tur === 'hedge'){
    const zam = Math.random() < 0.55;
    para(j.yakit * (zam ? 10 : 3), zam ? 'Akaryakıta zam geldi, fiyat kilidi kazandırdı' : 'Akaryakıt ucuzladı, kilit az getirdi');
  } else if (j.tur === 'sorusturma'){
    if (Math.random() < 0.55){ para(-j.ceza, 'Gümrük soruşturması: idari para cezası'); S.itibar = clamp(S.itibar - 20, 0, 100); log('İtibar 20 puan düştü.', 'kotu'); }
    else log('Gümrük dosyası kapandı. Bu sefer şanslıydın.', 'not');
  }
}

function kriz(){
  if (!varlikVar()) return;
  const g = gelir(), vg = varlikGider();
  const L = [
    () => [-vg * 4, 'Akaryakıta gece yarısı zammı'],
    () => [-Math.max(40e3 * S.I, g * rnd(0.3, 0.8)), 'Kantarda tonaj cezası'],
    () => [-Math.max(60e3 * S.I, g * rnd(0.5, 1.2)), 'Şanzıman arızası, araç sanayide'],
    () => [g * rnd(1.5, 3), 'Acil yük talebi, navlunlar fırladı'],
    () => [g * rnd(0.8, 1.6), 'Geciken alacak tahsil edildi'],
  ];
  if (S.cag >= 3) L.push(() => [-Math.max(g * 1.5, Math.min(Math.max(S.nakit, 0) * 0.08, g * 6)), 'Deprem: depo hasar gördü']);
  if (S.cag >= 4) L.push(() => { S.isler.forEach(j => { if (j.tur === 'sefer') j.kalan += 2; }); return [-g * 0.4, "Kapıkule'de 30 km TIR kuyruğu, seferler 2 gün gecikti"]; });
  if (S.cag >= 4) L.push(() => [-g * rnd(0.8, 1.5), "Euro'da sert dalgalanma, kur farkı zararı"]);
  if (S.cag >= 5) L.push(() => [-g * rnd(1, 2), 'Liman işçileri iş bıraktı']);
  if (S.cag >= 6) L.push(() => [g * rnd(3, 5), 'Süveyş tıkandı, Orta Koridor talebi patladı']);
  const [m, t] = pick(L)();
  para(m < 0 ? m * (1 - Math.min(0.5, etki('ceza'))) : m, t);
}

function ayKapat(){
  const ay = Math.floor((S.gun - 1) / 30) % 12;
  const biten = AYLAR[(ay + 11) % 12];
  if (S.ayKar > 0){ const v = S.ayKar * 0.25; S.nakit -= v; log(`${biten} kapandı. Kâr ${tlk(S.ayKar)} · Kurumlar vergisi (%25) -${tlk(v)}`, 'not'); }
  else log(`${biten} zararla kapandı: ${tlk(S.ayKar)}. Vergi çıkmadı.`, 'kotu');
  S.ayKar = 0;
  for (const h of Object.values(S.hatlar)) h.deger *= (1 + S.pi) * (1 + rnd(-0.04, 0.05));
  S.kur *= (1 + S.pi) * (1 + rnd(-0.025, 0.03));
  S.I *= 1 + S.pi;
  S.pi = clamp(S.pi + 0.3 * (0.025 - S.pi) + rnd(-0.006, 0.006), 0.008, 0.06);
  log(`${AYLAR[ay]} enflasyonu ${pct(S.pi)} · Kredi faizi yıllık ${pct(faizOrani())}`, 'not');
  if ((ay === 0 || ay === 6) && varlikVar()){ const c = varlikGider() * 1.2; S.nakit -= c; log(`Asgari ücret zammı: şoförlere fark ödemesi -${tlk(c)}`, 'kotu'); }
}

function solvency(){
  if (S.nakit >= 0){ if (S.negGun > 0){ S.negGun = 0; log('Kasa yeniden artıya geçti.', 'iyi'); } return; }
  S.negGun++;
  if (S.negGun === 1) log('Kasa ekside! 15 gün içinde toparlanmazsan iflas.', 'kotu');
  if (S.negGun >= 15){ S.iflas = true; clearInterval(timer); timer = null; log('İFLAS: Alacaklılar şirkete el koydu.', 'kotu'); iflasGoster(); }
}

      const ea = g.querySelector('#eur-al'); if (ea) ea.onclick = () => { const t = S.nakit * 0.25; S.nakit -= t; S.eur += t / (S.kur * 1.01); log(`Euro alındı: ${tlk(t)} → ${fmtInt(t / (S.kur * 1.01))} €`, 'not'); yatirimSheet(sekme); render(); };

const musaitSofor = () => S.soforler.filter(d => !S.isler.some(j => j.sofor === d.id));
function soforEtki(d, i, r){
  const oz = OZELLIK[d.oz], lv = soforSeviye(d);
  return {gun:Math.max(1, r.gun + oz.sure), risk:oz.risk * (i === 2 && oz.riskli ? oz.riskli : 1) * (1 - 0.06 * (lv - 1)), kar:oz.kar};
}
function seferSheet(teklif){
  if (!varlikVar()){ sheetAc('Riskli sefer', '<div class="metin">Önce en az bir araç al.</div>'); return; }
  const bos = musaitSofor();
  if (!bos.length){ sheetAc('Riskli sefer', `<div class="metin">Bütün şoförler yolda (${aktifSefer()}/${maxSefer()}). Biri dönünce yeni iş alabilirsin ya da "Şoför kadrosu"ndan yeni şoför işe al.</div>`); return; }
  const o = teklif || {ad:pick(SEFER_ISLERI[S.cag]), base:Math.max(gelir() * rnd(2.5, 4.5), 60e3 * S.I), sigorta:false, sec:1, sof:bos[0].id};
  if (!bos.some(d => d.id === o.sof)) o.sof = bos[0].id;
  const d = S.soforler.find(x => x.id === o.sof);
  const tip = S.cag === 4 ? 'sinir' : S.cag >= 5 ? 'deniz' : 'kara';
  const bonus = S.fail >= 2;
  const rc = (bonus ? 0.6 : 1) * riskAzalt();
  const avans = 0.4 * o.base;
  const hesap = (r, i) => { const e = soforEtki(d, i, r); const risk = Math.min(0.9, r.risk * rc * e.risk), kar = r.kar * e.kar * o.base, prim = risk * 0.9 * o.base * 1.25; const ev = o.sigorta ? (1 - risk) * kar - prim : (1 - risk) * kar - risk * 0.9 * o.base; return {gun:e.gun, risk, kar, prim, ev}; };
  const kartlar = ROTALAR.map((r, i) => {
    const h = hesap(r, i);
    return `<button class="rota ${o.sec === i ? 'kart secili' : ''}" data-rota="${i}"><span class="ad">${r.ad}</span><span class="ac">${ROTA_ACIKLAMA[tip][i]}</span>
      <span class="kv"><span>Süre</span><b>${h.gun} gün</b></span><span class="kv"><span>Başarı</span><b>${pct(1 - h.risk, 0)}</b></span>
      <span class="olasilik"><i style="width:${(1 - h.risk) * 100}%"></i></span>
      <span class="kv"><span>Kâr</span><b class="num">${tlk(h.kar)}</b></span><span class="kv"><span>Beklenen</span><b class="num ${h.ev >= 0 ? 'iyi' : 'kotu'}">${isaret(h.ev)}</b></span>
      <span class="kv"><span>Günlük beklenen</span><b class="num">${tlk(h.ev / h.gun)}</b></span></button>`;
  }).join('');
  const r = ROTALAR[o.sec], h = hesap(r, o.sec), prim = o.sigorta ? h.prim : 0;
  const soforler = bos.map(x => `<button class="sekme ${x.id === o.sof ? 'on' : ''}" data-sof="${x.id}">${x.ad} · ${OZELLIK[x.oz].ad} · Sv${soforSeviye(x)}</button>`).join('');
  sheetAc('Riskli sefer', `<div><div class="buyuk">${o.ad}</div><div class="metin">Yakıt ve şoför avansı ${tlk(avans)}. Başarısız olursa avans ve ${tlk(0.5 * o.base)} hasar senin.</div></div>
    <div><div class="etiket">Direksiyona kim geçsin?</div><div class="sekmeler">${soforler}</div><div class="metin">${memleketli(d.yer)} ${d.ad}: ${OZELLIK[d.oz].ac}. Seviye ${soforSeviye(d)} (her seviye riski %6 düşürür).</div></div>
    ${bonus ? '<div class="rozet reklam">Tecrübe bonusu: üst üste iki kayıptan sonra riskler %40 azaldı</div>' : ''}
    ${riskAzalt() < 1 ? `<div class="rozet">Teknoloji: kaza riski -%${Math.round((1 - riskAzalt()) * 100)}</div>` : ''}
    <div class="rotalar">${kartlar}</div>
    <label class="satir"><input type="checkbox" id="sigorta" ${o.sigorta ? 'checked' : ''}><span class="ana-metin"><span class="b">Yük sigortası yaptır</span><div class="s">Prim, riskin %125'i kadar. Kaza olursa avans geri döner, hasar ödenmez.</div></span></label>
    <div class="kv"><span>Ödenecek (avans + prim)</span><b class="num">${tl(avans + prim)}</b></div>
    <button class="btn ana" id="yola" ${S.nakit < avans + prim ? 'disabled' : ''}>${d.ad} ${r.ad.toLowerCase()} rotadan yola çıksın</button>`,
    g => {
      g.querySelectorAll('[data-rota]').forEach(b => b.onclick = () => { o.sec = +b.dataset.rota; seferSheet(o); });
      g.querySelectorAll('[data-sof]').forEach(b => b.onclick = () => { o.sof = b.dataset.sof; seferSheet(o); });
      g.querySelector('#sigorta').onchange = e => { o.sigorta = e.target.checked; seferSheet(o); };
      g.querySelector('#yola').onclick = () => {
        S.nakit -= avans + prim;
        S.isler.push({tur:'sefer', ad:o.ad, rota:r.ad, kalan:h.gun, toplam:h.gun, base:o.base, avans, prim, kar:h.kar / o.base, risk:h.risk, sigorta:o.sigorta, sofor:d.id, soforAd:d.ad});
        log(`${d.ad} yola çıktı: ${o.ad} (${r.ad} rota, başarı ${pct(1 - h.risk, 0)}).`, 'not');
        sheetKapat();
      };
    });
}

function soforSheet(adaylar){
  const limit = 1 + S.cag, ucret = 150e3 * S.I * S.soforler.length;
  const alinan = new Set(S.soforler.map(d => d.ad));
  const a = adaylar || [...SOFOR_HAVUZ].filter(x => !alinan.has(x.ad)).sort(() => Math.random() - 0.5).slice(0, 3);
  const liste = S.soforler.map(d => { const yolda = S.isler.find(j => j.sofor === d.id); return `<div class="satir"><span class="kod">Sv${soforSeviye(d)}</span><div class="ana-metin"><div class="b">${d.ad} <span class="rozet">${d.yer}</span> <span class="rozet">${OZELLIK[d.oz].ad}</span></div><div class="s">${OZELLIK[d.oz].ac} · ${d.xp} başarılı sefer · ${yolda ? `<span class="kotu">yolda: ${yolda.ad}</span>` : '<span class="iyi">garajda, hazır</span>'}</div></div></div>`; }).join('');
  const aday = a.map((x, i) => `<div class="satir"><div class="ana-metin"><div class="b">${x.ad} <span class="rozet">${x.yer}</span> <span class="rozet">${OZELLIK[x.oz].ad}</span></div><div class="s">${OZELLIK[x.oz].ac}</div></div><button class="btn ana kucuk" data-aday="${i}" ${S.soforler.length >= limit || S.nakit < ucret ? 'disabled' : ''}>İşe al</button></div>`).join('');
  sheetAc('Şoför kadrosu', `<div class="metin">Her şoför aynı anda bir sefere çıkar. Huyları rotadaki riski ve kârı değiştirir; başarılı seferlerle seviye atlarlar. Kadro sınırı her çağda bir artar.</div>
    <div class="kv"><span>Kadro</span><b>${S.soforler.length} / ${limit}</b></div>
    <div class="liste">${liste}</div><hr class="ayrac">
    <div class="etiket">İş başvuruları · işe alım bedeli ${tlk(ucret)}</div><div class="liste">${aday || '<div class="bos">Şu an başvuru yok.</div>'}</div>`,
    g => g.querySelectorAll('[data-aday]').forEach(b => b.onclick = () => {
      const x = a[+b.dataset.aday]; if (S.soforler.length >= limit || S.nakit < ucret) return;
      S.nakit -= ucret; S.soforler.push({...x, id:'s' + (S.sid++), xp:0});
      log(`${memleketli(x.yer)} ${x.ad} işe başladı (${OZELLIK[x.oz].ad}). -${tlk(ucret)}`, 'not'); toast(`${x.ad} kadroya katıldı`);
      soforSheet(a.filter(y => y !== x)); render();
    }), false, () => soforSheet(a));
}

function ihaleOlasilik(ih, b){

  return ih.rakipler.reduce((p, r) => p * (1 - Phi((be - ih.M * (1 + r.m)) / (ih.M * r.s))), 1);
}
function ihaleUret(){

  const havuz = S.cag >= 3 ? [...IHALELER, ...YAPIM_IHALE] : IHALELER;
  return boylar.map(b => {
    const M = Math.max(gelir(), 30e3 * S.I) * b.k * rnd(0.85, 1.2);
    const k = b.r[0] + Math.floor(Math.random() * (b.r[1] - b.r[0] + 1));
    const adlar = [...RAKIPLER].sort(() => Math.random() - 0.5).slice(0, k);
    return {ad:pick(havuz), boy:b.ad, sure:b.sure, M, rakipler:adlar.map(ad => ({ad, m:rnd(0.05, 0.3), s:rnd(0.05, 0.12)})), intel:false, oran:1.2, sonuc:null};
  });
}
function ihaleSheet(sec = null){
  if (S.cag < 2) return kilitSheet(2);
  if (!S.ihaleler || !S.ihaleler.length){ S.ihaleler = ihaleUret(); S.ihaleCd = 15; }
  const pano = `<div class="rotalar">${S.ihaleler.map((x, i) => `<button class="rota ${sec === i ? 'kart secili' : ''}" data-ih="${i}" ${x.sonuc ? 'disabled' : ''}><span class="rozet">${x.boy} · ${x.sure} gün</span><span class="ad" style="font-size:16px">${x.ad}</span><span class="ac">Tahmini maliyet ${tlk(x.M)} · ${x.rakipler.length} rakip</span>${x.sonuc ? `<span class="${x.sonuc.k}">${x.sonuc.t}</span>` : ''}</button>`).join('')}</div>`;
  const ust = `<div class="metin">Kamu İhale Bülteni. En düşük teklif kazanır; gerçek maliyet tahminden %8 düşük ile %15 yüksek arasında çıkabilir. İtibarın (${Math.round(S.itibar)}) puanlamada %${dec(S.itibar / 10, 1)} avantaj sağlar. Yeni ilanlar ${S.ihaleCd} gün sonra.</div>${pano}`;
  if (sec === null || S.ihaleler[sec].sonuc){
    sheetAc('İhaleler', ust + '<div class="metin">Teklif vermek için bir ilan seç.</div>', g => g.querySelectorAll('[data-ih]').forEach(b => b.onclick = () => ihaleSheet(+b.dataset.ih)), false, () => ihaleSheet(sec));
    return;
  }
  const ih = S.ihaleler[sec];
  const yaz = g => {
    const b = ih.M * ih.oran, p = ihaleOlasilik(ih, b), ev = p * (b - 1.035 * ih.M);
    g.querySelector('#ih-b').textContent = tl(b);
    g.querySelector('#ih-p').textContent = pct(p, 0);
    g.querySelector('#ih-bar').style.width = (p * 100) + '%';
    const e = g.querySelector('#ih-ev'); e.textContent = isaret(ev); e.className = 'num ' + (ev >= 0 ? 'iyi' : 'kotu');
    g.querySelector('#ih-m').textContent = pct(ih.oran - 1, 0);
  };
  sheetAc('İhaleler', `${ust}<div class="buyuk">${ih.ad}</div>
    <div class="kart"><div class="etiket">${ih.rakipler.length} rakip zarf verdi</div>
      ${ih.intel ? ih.rakipler.map(r => `<div class="kv"><span>${r.ad}</span><b class="num">${tlk(ih.M * (1 + r.m - r.s))} – ${tlk(ih.M * (1 + r.m + r.s))}</b></div>`).join('') : `<div class="metin">Rakiplerin teklif aralığını bilmiyorsun.</div><button class="btn kucuk" id="intel"><span class="rozet reklam">Reklam</span> Ofiste çay sohbeti: istihbarat al</button>`}
    </div>
    <div><div class="kv"><span>Teklifin (kâr marjı <b id="ih-m"></b>)</span><b class="num" id="ih-b"></b></div>
      <input type="range" id="teklif" min="0.85" max="1.6" step="0.005" value="${ih.oran}" aria-label="Teklif tutarı"></div>
    <div class="ikili"><div class="stat"><div class="k">Kazanma ihtimali</div><div class="v" id="ih-p"></div><div class="olasilik" style="margin-top:6px"><i id="ih-bar"></i></div></div>
      <div class="stat"><div class="k">Beklenen kâr</div><div class="v" id="ih-ev"></div></div></div>
    <button class="btn ana" id="zarf">Zarfı teslim et</button>`,
    g => {
      yaz(g);
      g.querySelector('#teklif').oninput = e => { ih.oran = +e.target.value; yaz(g); };
      const intel = g.querySelector('#intel');
      if (intel) intel.onclick = () => reklam(() => { ih.intel = true; ihaleSheet(sec); });
      g.querySelectorAll('[data-ih]').forEach(b => b.onclick = () => ihaleSheet(+b.dataset.ih));
      g.querySelector('#zarf').onclick = () => {
        const b = ih.M * ih.oran, be = b * (1 - S.itibar / 1000);
        const teklifler = ih.rakipler.map(r => ({ad:r.ad, b:ih.M * (1 + r.m) + ih.M * r.s * randn()}));
        const enDusuk = teklifler.reduce((a, c) => c.b < a.b ? c : a);
        if (be < enDusuk.b){
          const Mg = ih.M * (1 + rnd(-0.08, 0.15));
          S.isler.push({tur:'ihale', ad:ih.ad, kalan:ih.sure, toplam:ih.sure, b, M:Mg});
          ih.sonuc = {t:`Kazandın: ${tlk(b)}`, k:'iyi'};
          log(`İhaleyi kazandın: ${ih.ad} (${tlk(b)}). En yakın rakip ${enDusuk.ad}.`, 'iyi'); toast('İhale senin!');
        } else {
          ih.sonuc = {t:`${enDusuk.ad} aldı: ${tlk(enDusuk.b)}`, k:'kotu'};
          log(`İhaleyi ${enDusuk.ad} kazandı (${tlk(enDusuk.b)}).`, 'kotu'); toast(`İhaleyi ${enDusuk.ad} aldı`);
        }
        ihaleSheet(null); render();
      };
    }, false, () => ihaleSheet(sec));
}

function muzayedeSheet(){
  if (S.cag < 5) return kilitSheet(5);
  if (!S.muz && S.muzCd > 0){ sheetAc('Gümrük müzayedesi', `<div class="metin">Sonraki müzayede ${S.muzCd} gün sonra Mersin Gümrük Müdürlüğü'nde.</div>`); return; }
  if (!S.muz){
    const olcek = Math.max(gelir() * 2, 2e6 * S.I);
    S.muz = {sec:null, kaplar:[0, 1, 2, 3].map(() => {
      const k = pick(KONTEYNER), lo = k.lo * olcek, hi = k.hi * olcek;
      const kacak = Math.random() < k.kacak;
      const v = kacak ? 0 : lo + (hi - lo) * (Math.random() + Math.random()) / 2;
      const ort = (lo + hi) / 2;
      const orn = Array.from({length:400}, () => Math.max(ort * rnd(0.5, 0.92), ort * rnd(0.5, 0.92), ort * rnd(0.5, 0.92))).sort((a, b) => a - b);
      return {ad:k.ad, no:'MSKU' + Math.floor(rnd(100000, 999999)), lo, hi, v, kacak, eksp:false, orn, teklif:ort * 0.7};
    })};
  }
  const m = S.muz;
  const aralik = c => c.eksp ? (c.kacak ? [0, 0] : [Math.max(c.lo, c.v - 0.25 * (c.hi - c.lo)), Math.min(c.hi, c.v + 0.25 * (c.hi - c.lo))]) : [c.lo, c.hi];
  const P = (c, b) => { let i = 0; while (i < c.orn.length && c.orn[i] < b) i++; return i / c.orn.length; };
  const kartlar = m.kaplar.map((c, i) => { const [a, b] = aralik(c); return `<button class="rota ${m.sec === i ? 'kart secili' : ''}" data-kap="${i}"><span class="kod">${c.no}</span><span class="ad">${c.ad}</span><span class="ac">${c.eksp ? (c.kacak ? 'Ekspertiz: kaçak eşya şüphesi' : 'Ekspertiz yapıldı') : 'Manifest ipucu'}</span><span class="num">${c.kacak && c.eksp ? 'Değer yok' : tlk(a) + ' – ' + tlk(b)}</span></button>`; }).join('');
  let alt = '<div class="metin">Bir konteyner seç. Değer aralığı herkese açık. Ekspertiz aralığı daraltır ve kaçak eşyayı ortaya çıkarır.</div>';
  if (m.sec !== null){
    const c = m.kaplar[m.sec], [a, b] = aralik(c), ort = (a + b) / 2, max = c.hi;
    alt = `<div class="kart"><div class="kv"><span>Teklifin</span><b class="num" id="mz-b"></b></div>
      <input type="range" id="mz-t" min="0" max="1" step="0.005" value="${clamp(c.teklif / max, 0, 1)}" aria-label="Müzayede teklifi">
      <div class="ikili"><div class="stat"><div class="k">Kazanma ihtimali</div><div class="v" id="mz-p"></div></div><div class="stat"><div class="k">Beklenen kâr</div><div class="v" id="mz-ev"></div></div></div>
      <div class="kv"><span>Beklenen değer</span><b class="num">${tlk(ort)}</b></div>
      ${c.eksp ? '' : '<button class="btn kucuk" id="eksp"><span class="rozet reklam">Reklam</span> Ücretsiz ekspertiz yaptır</button>'}
      <button class="btn ana" id="mz-ver">Teklifi ver</button></div>`;
  }
  sheetAc('Gümrük müzayedesi', `<div class="metin">Limanda sahipsiz kalan konteynerler açık artırmada. Üç tüccar seninle yarışıyor. Kaçak eşya çıkarsa yetkililere teslim edersin ve itibar kazanırsın.</div>
    <div class="rotalar" style="grid-template-columns:repeat(2,minmax(0,1fr))">${kartlar}</div>${alt}`,
    g => {
      g.querySelectorAll('[data-kap]').forEach(b => b.onclick = () => { m.sec = +b.dataset.kap; muzayedeSheet(); });
      if (m.sec === null) return;
      const c = m.kaplar[m.sec], [a, b] = aralik(c), ort = (a + b) / 2;
      const yaz = () => { const t = c.teklif, p = P(c, t), ev = p * (ort - t); g.querySelector('#mz-b').textContent = tl(t); g.querySelector('#mz-p').textContent = pct(p, 0); const e = g.querySelector('#mz-ev'); e.textContent = isaret(ev); e.className = 'v ' + (ev >= 0 ? 'iyi' : 'kotu'); g.querySelector('#mz-ver').disabled = S.nakit < t || t <= 0; };
      yaz();
      g.querySelector('#mz-t').oninput = e => { c.teklif = +e.target.value * c.hi; yaz(); };
      const ek = g.querySelector('#eksp'); if (ek) ek.onclick = () => reklam(() => { c.eksp = true; muzayedeSheet(); });
      g.querySelector('#mz-ver').onclick = () => {
        const t = c.teklif, rakip = Math.max(...[0, 1, 2].map(() => (c.lo + c.hi) / 2 * rnd(0.5, 0.92)));
        S.muz = null; S.muzCd = 15;
        if (t > rakip){
          S.nakit -= t; S.ayKar -= t;
          if (c.kacak){ S.itibar = clamp(S.itibar + 10, 0, 100); log(`${c.no} içinden kaçak eşya çıktı, yetkililere teslim edildi. -${tlk(t)} · İtibar +10`, 'kotu'); toast('Kaçak eşya! İtibar +10'); }
          else { S.nakit += c.v; S.ayKar += c.v; log(`${c.no} (${c.ad}) ${tlk(t)}'ye alındı, ${tlk(c.v)}'ye satıldı: ${isaret(c.v - t)}`, c.v >= t ? 'iyi' : 'kotu'); toast(`Konteyner: ${isaret(c.v - t)}`); }
        } else { log(`${c.no} için bir tüccar ${tlk(rakip)} verdi, müzayedeyi kaçırdın.`, 'not'); toast('Müzayedeyi kaçırdın'); }
        sheetKapat();
      };
    });
}

    {cag:3, f:() => ({b:'Şoförler iş bıraktı', m:'Şoförler yevmiyelerin enflasyonun altında kaldığını söylüyor ve kontak kapattı.', s:[
      {e:'Zam ver', d:`-${tlk(vg * 5)}`, fn:() => para(-vg * 5, 'Şoförlere ek zam')},
      {e:'Direnmek', d:`%50 grev biter · %50 beş gün gelir yok (-${tlk(g * 5)})`, fn:() => Math.random() < 0.5 ? log('Grev kendiliğinden bitti.', 'iyi') : para(-g * 5, 'Grev uzadı, beş gün sefer yok')}]})},
    {cag:4, f:() => { const G = g * 2, C = g * 12; return {b:'Gümrükte "hızlandırma" teklifi', m:"Bir görevli 'evrakını bugün hallederim, ufak bir jest yeter' diyor. Yük bekledikçe para yanıyor.", s:[
      {e:'Kabul et', d:`Şimdi +${tlk(G)} · %55 ihtimalle soruşturma: -${tlk(C)} ve itibar -20`, fn:() => { para(G, 'Yük hızlı çıktı'); S.isler.push({tur:'sorusturma', ad:'Gümrük dosyası', kalan:45, toplam:45, ceza:C}); }},
      {e:'Reddet ve bildir', d:'Yük 1 gün gecikir · İtibar +6', fn:() => { S.itibar = clamp(S.itibar + 6, 0, 100); log('Rüşvet teklifini bildirdin. İtibar +6.', 'iyi'); }}]}; }},
  ].filter(k => k.cag <= S.cag);
  const kart = pick(K).f();
  sheetAc(kart.b, `<div class="metin">${kart.m}</div><div class="secim">${kart.s.map((s, i) => `<button data-s="${i}"><span class="e">${s.reklam ? '<span class="rozet reklam">Reklam</span> ' : ''}${s.e}</span><span class="d">${s.d}</span></button>`).join('')}</div>`,
    gv => gv.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { const s = kart.s[+b.dataset.s]; const bitir = () => { s.fn(); sheetKapat(); }; s.reklam ? reklam(bitir) : bitir(); }), true);
}

function iflasGoster(){
  render();
  $('#iflas-ozet').textContent = `Gün ${S.gun} · Kasa ${tl(S.nakit)} · Borç ${tlk(S.borc)}`;
  $('#konkordato').hidden = S.konk;
  $('#iflas').hidden = false;
}
$('#konkordato').onclick = () => reklam(() => {
  const yap = -Math.min(S.nakit, 0);
  S.konk = true; S.iflas = false; S.negGun = 0; S.borc += yap; S.nakit = Math.max(500e3 * S.I, gelir() * 10);
  log(`Konkordato onaylandı: ${tlk(yap)} borç krediye yapılandırıldı.`, 'not');
  $('#iflas').hidden = true; hizAyarla(S.hiz || 1); render();
});
$('#sifirla').onclick = () => { yeniOyun(1, S.yildiz); $('#iflas').hidden = true; hizAyarla(1); render(); kaydet(); };

const AKSIYON = [
  {id:'yatirim', ad:'Yatırım yap', cag:1, ana:true, alt:() => `${VARLIK.filter(v => v.tur === 'arac' && v.cag <= S.cag).length} araç ve ekipman türü`, fn:() => yatirimSheet('arac')},
  {id:'sefer', ad:'Risk al: sefer', cag:1, ana:true, alt:() => `${aktifSefer()}/${maxSefer()} şoför yolda`, fn:() => seferSheet()},
  {id:'insaat', ad:'İnşaat yap', cag:1, alt:() => `${aktifInsaat()}/${maxInsaat()} şantiye dolu`, fn:() => yatirimSheet('bina')},
  {id:'yan', ad:'Yan işler', cag:1, alt:() => `${VARLIK.filter(v => v.tur === 'yan' && adet(v.id) > 0).length} işletme açık`, fn:() => yatirimSheet('yan')},
  {id:'ihale', ad:'İhaleler', cag:2, alt:() => `${(S.ihaleler || []).filter(x => !x.sonuc).length} açık ilan · yenisi ${S.ihaleCd} gün`, fn:() => ihaleSheet()},
  {id:'gayri', ad:'Hatlar ve döviz', cag:1, alt:() => `${Object.keys(S.hatlar).length} hat · ${fmtInt(S.eur)} €`, fn:() => yatirimSheet('gayri')},
  {id:'sofor', ad:'Şoför kadrosu', cag:1, alt:() => `${S.soforler.length}/${1 + S.cag} şoför`, fn:soforSheet},
  {id:'tekno', ad:'Teknoloji', cag:1, alt:() => `${Object.keys(S.tekno).length}/${TEKNO.length} kurulu`, fn:() => yatirimSheet('tekno')},
  {id:'kredi', ad:'Banka', cag:1, alt:() => `Borç ${tlk(S.borc)} · faiz ${pct(faizOrani(), 0)}`, fn:krediSheet},
  {id:'personel', ad:'Filo müdürü', cag:3, alt:() => `${S.mudur} müdür`, fn:personelSheet},
  {id:'statu', ad:'Statü ve itibar', cag:3, alt:() => `İtibar ${Math.round(S.itibar)}/100`, fn:statuSheet},
  {id:'muzayede', ad:'Gümrük müzayedesi', cag:5, alt:() => S.muz ? 'Açık artırma sürüyor' : S.muzCd ? `${S.muzCd} gün sonra` : '4 konteyner satışta', fn:muzayedeSheet},
  {id:'halkaarz', ad:'Halka arz', cag:7, alt:() => `Reel eşik ${tlk(HALKA_ARZ)}`, fn:halkaArzSheet},
];

function renderUst(){
  const c = CAGLAR[S.cag - 1];
  $('#unvan').innerHTML = `${c.unvan} · Çağ ${S.cag}: ${c.ad}${S.yildiz ? ` · <span class="yildiz">${'★'.repeat(Math.min(S.yildiz, 10))}${S.yildiz > 10 ? '+' : ''} ${S.yildiz} yıldız</span>` : ''}`;
  document.querySelectorAll('#hiz button').forEach(b => { b.classList.toggle('on', +b.dataset.hiz === S.hiz && !(sheetAcik && S.hiz > 0)); b.disabled = S.iflas; });
}

function render(){
  renderUst();
  $('#caglar').innerHTML = CAGLAR.map(c => `<button class="levha ${c.n > S.cag ? 'kilit' : ''} ${c.n === S.cag ? 'simdi' : ''}" data-cag="${c.n}" aria-label="Çağ ${c.n}: ${c.ad}"><div class="ust">ÇAĞ ${c.n}${c.n < S.cag ? ' ✓' : ''}</div><div class="ad">${c.ad}</div><div class="km">${c.esik ? tlk(c.esik) : 'Başlangıç'}</div></button>`).join('');

  const n = net(), gun = (S.gun - 1) % 30 + 1, ay = Math.floor((S.gun - 1) / 30) % 12, yil = Math.floor((S.gun - 1) / 360) + 1;
  const sc = sonraki(), hedef = sc ? sc.esik : HALKA_ARZ, ilerleme = clamp(reelND() / hedef, 0, 1);
  $('#kasa').innerHTML = `<div class="tarih"><span>${yil}. yıl · ${gun} ${AYLAR[ay]} · gün ${S.gun}</span>${S.negGun ? `<span class="uyari">İflasa ${15 - S.negGun} gün</span>` : sheetAcik ? '<span>Oyun duraklatıldı</span>' : ''}</div>
    <div class="kasa-rakam ${S.nakit < 0 ? 'eksi' : ''}">${tl(S.nakit)}</div>
    <div class="statlar">
      <div class="stat"><div class="k">Günlük net</div><div class="v ${n >= 0 ? 'iyi' : 'kotu'}">${isaret(n)}</div></div>
      <div class="stat"><div class="k">Net değer</div><div class="v">${tlk(netDeger())}</div></div>
      <div class="stat"><div class="k">Günlük gelir</div><div class="v">${tlk(gelir())}</div></div>
      <div class="stat"><div class="k">Günlük gider</div><div class="v">${tlk(gider())}</div></div>
      <div class="stat"><div class="k">Aylık enflasyon</div><div class="v">${pct(S.pi)}</div></div>
      <div class="stat"><div class="k">Fiyat endeksi</div><div class="v">${dec(S.I, 2)}×</div></div>
      <div class="stat"><div class="k">Bu ay kâr</div><div class="v ${S.ayKar >= 0 ? '' : 'kotu'}">${tlk(S.ayKar)}</div></div>
      <div class="stat"><div class="k">Borç</div><div class="v">${tlk(S.borc)}</div></div>
    </div>
    <div class="yol"><div class="bas"><span>${sc ? `Sonraki çağ: <b>${sc.ad}</b>` : '<b>Halka arz</b> hedefi'}</span><span class="num">${tlk(reelND())} / ${tlk(hedef)} reel</span></div><div class="serit"><div class="dolu" style="width:${ilerleme * 100}%"></div></div></div>`;

  const ucret = sc ? sc.esik * 0.08 * S.I : 0;
  $('#gecis').innerHTML = sc && reelND() >= sc.esik ? `<div class="gecis"><div><div class="ust etiket" style="color:inherit;opacity:.85">Ruhsat hazır</div><b>Çağ ${sc.n}: ${sc.ad}</b></div><button class="btn ana" id="gec" ${S.nakit < ucret ? 'disabled' : ''}>Ruhsat al · ${tlk(ucret)}</button></div>` : '';

  $('#aksiyonlar').innerHTML = AKSIYON.map(a => { const k = a.cag > S.cag; return `<button class="aks ${k ? 'kilit' : a.ana ? 'ana' : ''}" data-aks="${a.id}" ${S.iflas ? 'disabled' : ''}><span class="ad">${a.ad}</span><span class="alt">${k ? `Çağ ${a.cag}'de açılır` : a.alt()}</span></button>`; }).join('');

  $('#isler').innerHTML = S.isler.length ? S.isler.map((j, i) => {
    const kod = {sefer:'SEFER', ihale:'İHALE', alacak:'ALACAK', hedge:'KİLİT', sorusturma:'DOSYA', insaat:'İNŞAAT'}[j.tur];
    const ek = j.tur === 'sefer' ? `${j.soforAd ? j.soforAd + ' · ' : ''}${j.rota} rota · başarı ${pct(1 - j.risk, 0)}${j.sigorta ? ' · sigortalı' : ''}` : j.tur === 'ihale' ? `Sözleşme bedeli ${tlk(j.b)}` : j.tur === 'alacak' ? `${tlk(j.tutar)} · %90 tahsil` : j.tur === 'hedge' ? 'Zam gelirse kazandırır' : j.tur === 'insaat' ? 'Şantiye: bitince hizmete girer' : '%55 ceza ihtimali';
    const hz = (j.tur === 'sefer' || j.tur === 'insaat') && !j.hizli && j.kalan > 1;
    return `<div class="is"><div class="satir"><span class="kod">${kod}</span><div class="ana-metin"><div class="b">${j.ad}</div><div class="s">${ek} · ${j.kalan} gün</div></div>${hz ? `<button class="btn kucuk" data-hizlandir="${i}"><span class="rozet reklam">Reklam</span> Hızlandır</button>` : ''}</div><div class="ilerle"><i style="width:${(1 - j.kalan / j.toplam) * 100}%"></i></div></div>`;
  }).join('') : '<div class="bos">Yolda iş ya da şantiye yok. "Risk al: sefer" veya "İnşaat yap" ile başla.</div>';

  const grup = t => { const L = VARLIK.filter(v => v.tur === t && adet(v.id) > 0); return L.length ? `<div class="etiket">${{arac:'Araç ve ekipman', bina:'Binalar', yan:'Yan işler'}[t]}</div>` + L.map(v => { const nt = adet(v.id) * (v.gelir * carpan() - v.gider * (1 - indirim())) * S.I; return `<div class="satir"><span class="kod">${v.kod}</span><div class="ana-metin"><div class="b">${v.ad} × ${adet(v.id)}</div><div class="s">${v.indirim ? `Gider -%${Math.round(v.indirim * 100)} · ` : ''}${v.yonetim ? `Yönetim -%${Math.round(v.yonetim * 100)} · ` : ''}Değer ${tlk(adet(v.id) * v.fiyat * S.I * 0.7)}</div></div><span class="num ${nt >= 0 ? 'iyi' : 'kotu'}">${isaret(nt)}</span></div>`; }).join('') : ''; };
  $('#varliklar').innerHTML = `<div class="liste">${grup('arac')}${grup('bina')}${grup('yan')}${VARLIK.some(v => adet(v.id) > 0) ? '' : '<div class="bos">Filon yok.</div>'}</div>
    <hr class="ayrac">
    ${Object.keys(S.hatlar).length ? `<div class="kv"><span>${Object.keys(S.hatlar).length} hat ruhsatı (piyasa değeri)</span><b class="num">${tlk(hatDeger())}</b></div>` : ''}
    ${S.eur > 0 ? `<div class="kv"><span>Euro hesabı (${fmtInt(S.eur)} € · kur ${dec(S.kur, 2)})</span><b class="num">${tlk(S.eur * S.kur)}</b></div>` : ''}
    ${Object.keys(S.tekno).length ? `<div class="kv"><span>Teknoloji</span><b>${TEKNO.filter(x => S.tekno[x.id]).map(x => x.ad.split(' ')[0]).join(', ')}</b></div>` : ''}
    <div class="kv"><span>Gider indirimi (atölye, istasyon, teknoloji)</span><b class="num iyi">-%${Math.round(indirim() * 100)}</b></div>
    <div class="kv"><span>Yönetim gideri (ağırlık ${dec(agirlik(), 1)}, üs ${dec(us(), 3)})</span><b class="num kotu">-${tlk(yonetim())}</b></div>
    ${S.mudur ? `<div class="kv"><span>Filo müdürü maaşları</span><b class="num kotu">-${tlk(mudurGider())}</b></div>` : ''}
    <div class="kv"><span>Kredi faizi</span><b class="num kotu">-${tlk(faiz())}</b></div>
    <div class="kv"><span>Gelir çarpanı (itibar, yıldız, statü)</span><b class="num">×${dec(carpan(), 2)}</b></div>`;

  $('#gunluk').innerHTML = S.log.map(l => `<div class="g"><span class="gun">G${l.g}</span><span class="${l.k}">${l.t}</span></div>`).join('');
}

document.addEventListener('click', e => {
  const h = e.target.closest('[data-hiz]'); if (h && !S.iflas){ hizAyarla(+h.dataset.hiz); return; }
  const c = e.target.closest('[data-cag]'); if (c){ cagSheet(+c.dataset.cag); return; }
  const a = e.target.closest('[data-aks]'); if (a){ const x = AKSIYON.find(y => y.id === a.dataset.aks); x.cag > S.cag ? kilitSheet(x.cag) : x.fn(); return; }
  const z = e.target.closest('[data-hizlandir]'); if (z){ const j = S.isler[+z.dataset.hizlandir]; if (j) reklam(() => { j.kalan = Math.max(1, Math.ceil(j.kalan / 2)); j.hizli = true; log(`${j.ad}: sefer hızlandırıldı.`, 'not'); render(); }); return; }
  if (e.target.closest('#gec')){ const sc = sonraki(), u = sc.esik * 0.08 * S.I; if (S.nakit < u) return; S.nakit -= u; S.cag = sc.n; log(`Ruhsat alındı: Çağ ${sc.n} (${sc.ad}) başladı. -${tlk(u)}`, 'iyi'); kaydet(); render(); cagSheet(sc.n); }
});

const KEY = 'nakliye-baronu-demo-v3';
function kaydet(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function yukle(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.gun && s.varlik && s.hatlar && s.soforler) return s; } catch (e) {} return null; }

function start(veri){
  S = (veri && veri.S) || yukle();
  if (!S) yeniOyun(1);
  window.claude?.hot?.snapshot?.(() => ({S}));
  render();
  if (S.iflas) iflasGoster(); else hizAyarla(S.hiz ?? 1);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
