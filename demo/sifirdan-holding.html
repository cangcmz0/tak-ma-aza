<title>Sıfırdan Holding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: one phone-width game column with a sticky cash header and a bottom tab bar. Identity: a dusk skyline over Erciyes that fills with the player's own buildings; deep night indigo, coral for action, gold for money and prestige, mint for gains. Single dark game world by design. */
:root{
  --bg:#0c0f24; --bg-2:#12163a; --card:#181d45; --card-2:#232a5c; --card-3:#2d3570; --line:rgba(255,255,255,.08);
  --ink:#f3f4ff; --muted:#a0a7d4; --accent:#ff6b4a; --accent-d:#c2422a; --gold:#ffc24b; --gold-d:#b97f12;
  --good:#3fe0a0; --bad:#ff5c7c; --scrim:rgba(5,6,18,.72); --press:#0e1233;
  --f-display:'Baloo 2','Trebuchet MS',sans-serif; --f-body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:radial-gradient(900px 520px at 50% -160px,#2b2474 0%,rgba(12,15,36,0) 70%),var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.42}
.num{font-variant-numeric:tabular-nums}
.app{max-width:580px;margin:0 auto;padding-block:0 calc(104px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.ust-kap{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;gap:10px;padding-block:12px 12px;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(12,15,36,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.ust{display:flex;align-items:center;gap:11px}
.logo{flex:0 0 auto;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--accent));color:#2a1200;font-family:var(--f-display);font-weight:800;font-size:19px;box-shadow:0 4px 0 var(--accent-d),inset 0 1px 0 rgba(255,255,255,.4)}
.kimlik{min-width:0;flex:1}
.app > *,.ust-kap > *,.gorunum > *{min-width:0}
.firma{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.05;overflow-wrap:anywhere}
.unvan{color:var(--muted);font-size:12.5px;font-weight:700}
.yildiz{color:var(--gold)}
.hiz{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.hiz button{border:0;background:none;padding:5px 7px;border-radius:9px;font-weight:800;font-size:12.5px;color:var(--muted)}
.hiz button.on{background:var(--accent);color:#fff}
.kasa-bar{position:relative;background:linear-gradient(135deg,#262e70,#1a1f4c);border:1px solid var(--line);border-radius:20px;padding:11px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.kasa-et{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kasa{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.kasa.eksi{color:var(--bad)}
.cipler-ust{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.cipu{background:rgba(255,255,255,.08);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
.ucanlar{position:absolute;inset:0;pointer-events:none}
.ucan{position:absolute;top:8px;font-family:var(--f-display);font-weight:800;font-size:17px;animation:ucus 1.4s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.5);white-space:nowrap}
@keyframes ucus{from{transform:translateY(6px) scale(.9);opacity:0}15%{opacity:1;transform:translateY(0) scale(1)}to{transform:translateY(-40px);opacity:0}}
.hero{position:relative;height:250px;border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.hero canvas{display:block;width:100%;height:100%}
.hero-ust{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cam{background:rgba(10,10,35,.45);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800}
.hero-alt{position:absolute;left:12px;right:12px;top:50px;background:rgba(10,10,35,.5);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 11px}
.hero-yazi{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;margin-bottom:5px}
.hero-yazi b{color:var(--gold)}
.bar{height:9px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .4s}
.bar.ince{height:6px}
.bar.yesil i{background:linear-gradient(90deg,#2fc58b,var(--good))}
.gorunum{display:grid;gap:14px}
.blok{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);min-width:0}
.blok-bas{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.blok-bas h2,.baslik{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1}
.ipucu{font-size:12px;color:var(--muted);font-weight:700}
.link{background:none;border:0;color:var(--gold);font-weight:800;font-size:13px;padding:0}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:11px;display:flex;align-items:center;gap:10px;min-width:0}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:800}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat > div{min-width:0}
.iyi{color:var(--good)} .kotu{color:var(--bad)}
.hizli{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.oyun-btn{border:0;border-radius:18px;padding:12px;background:var(--card-2);color:var(--ink);font-weight:800;box-shadow:0 4px 0 var(--press),inset 0 1px 0 rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;text-align:left;transition:transform .08s,box-shadow .08s;min-width:0}
.oyun-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
.oyun-btn > span{min-width:0}
.oyun-btn b{display:block;font-family:var(--f-display);font-size:16px;line-height:1.1}
.oyun-btn small{display:block;font-weight:700;opacity:.78;font-size:12px}
.oyun-btn.mercan{background:linear-gradient(180deg,#ff8463,#ff5a3c);box-shadow:0 4px 0 var(--accent-d),inset 0 1px 0 rgba(255,255,255,.28);color:#fff}
.oyun-btn.altin{background:linear-gradient(180deg,#ffd572,#ffb52e);box-shadow:0 4px 0 var(--gold-d),inset 0 1px 0 rgba(255,255,255,.4);color:#2a1a00}
.oyun-btn.mercan:active:not(:disabled){box-shadow:0 1px 0 var(--accent-d)}
.oyun-btn.altin:active:not(:disabled){box-shadow:0 1px 0 var(--gold-d)}
.oyun-btn.mercan .ikon,.oyun-btn.altin .ikon{background:rgba(255,255,255,.24);color:inherit}
.oyun-btn.kucuk{padding:9px 12px;border-radius:13px;font-size:13.5px;justify-content:center;text-align:center}
.oyun-btn.genis{width:100%;justify-content:center;padding:14px}
.ikon{flex:0 0 auto;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.ikon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ikon.b{width:48px;height:48px;border-radius:15px}
.ikon.b svg{width:25px;height:25px}
.yol{display:flex;gap:0;overflow-x:auto;padding:4px 2px 6px}
.dugum{flex:0 0 auto;width:104px;background:none;border:0;display:grid;justify-items:center;gap:4px;text-align:center;position:relative;padding:0 4px}
.dugum::before{content:"";position:absolute;top:19px;left:-50%;width:100%;height:4px;background:var(--card-3);z-index:0}
.dugum:first-child::before{display:none}
.dugum.gecti::before,.dugum.simdi::before{background:linear-gradient(90deg,var(--gold),var(--accent))}
.dugum .nokta{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--card-3);color:var(--muted);border:3px solid var(--card)}
.dugum.gecti .nokta{background:var(--gold);color:#2a1a00}
.dugum.simdi .nokta{background:var(--accent);color:#fff;box-shadow:0 0 0 5px rgba(255,107,74,.25);animation:nabiz 1.8s ease-in-out infinite}
@keyframes nabiz{50%{box-shadow:0 0 0 9px rgba(255,107,74,.08)}}
.dugum .ad{font-weight:800;font-size:12.5px;line-height:1.15}
.dugum .esik{font-size:11px;color:var(--muted);font-weight:700}
.akis{display:grid;gap:8px}
.haber{display:grid;grid-template-columns:10px 44px minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px}
.haber .nokta{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--muted)}
.haber.iyi .nokta{background:var(--good)} .haber.kotu .nokta{background:var(--bad)}
.haber.iyi .t,.haber.kotu .t{color:var(--ink)}
.haber .g{font-size:11.5px;color:var(--muted);font-weight:800;padding-top:1px}
.haber .t{color:var(--muted)}
.gecis{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,rgba(255,194,75,.18),rgba(255,107,74,.18));border:1.5px solid var(--gold);border-radius:18px;padding:12px 14px}
.gecis b{font-family:var(--f-display);font-size:18px;display:block}
.gecis small{color:var(--muted);font-weight:700}
.sehir-kart{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:12px}
.sehir-kart.kapali{background:none;border-style:dashed}
.sk-bas{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sk-bas > div:first-child{min-width:0}
.sk-ad{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.05}
.sk-alt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:3px}
.sk-alt .ikon{width:22px;height:22px;border-radius:7px}
.sk-alt .ikon svg{width:13px;height:13px}
.sk-net{font-family:var(--f-display);font-weight:800;font-size:17px;text-align:right;white-space:nowrap}
.sk-net small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted)}
.isl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.isl{display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:8px;min-width:0}
.isl > div{min-width:0}
.isl-ad{font-weight:800;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isl-alt{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isl.kur{border-style:dashed;opacity:.75}
.kilit-rozet{font-size:11.5px;font-weight:800;color:var(--muted);background:var(--card-2);border-radius:999px;padding:4px 10px;white-space:nowrap}
.proje{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:11px;display:grid;gap:8px}
.satir{display:flex;align-items:center;gap:10px;min-width:0}
.satir .ana-metin{flex:1;min-width:0}
.satir .ana-metin .b{font-weight:800}
.satir .ana-metin .s{font-size:12.5px;color:var(--muted);font-weight:600}
.liste{display:grid;gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:2px 0}
.kv span:first-child{color:var(--muted);font-weight:600}
.kv b{font-weight:800;text-align:right}
.ayrac{border:0;border-top:1px solid var(--line);margin:6px 0}
.bos{color:var(--muted);font-size:13.5px;font-weight:600}
.ikili{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ucuz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grup-kart{display:flex;align-items:center;gap:12px}
.grup-kart .logo{width:58px;height:58px;font-size:23px;border-radius:18px}
.yildizlar{color:var(--gold);font-weight:800;font-size:13px}
.etiket{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.altnav{position:fixed;left:0;right:0;bottom:0;z-index:22;background:rgba(14,17,42,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-right,0px)) calc(7px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.altnav .ic{display:flex;max-width:580px;margin:0 auto;justify-content:space-around;gap:4px}
.altnav button{flex:1;background:none;border:0;display:grid;justify-items:center;gap:1px;color:var(--muted);font-size:11.5px;font-weight:800;padding:6px 2px;border-radius:14px}
.altnav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.altnav button.on{color:var(--accent);background:rgba(255,107,74,.13)}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet .kutu{background:var(--bg-2);border:1px solid var(--line);width:min(600px,100%);max-height:88%;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:yuk .22s cubic-bezier(.2,.9,.3,1.2)}
.sheet .kutu::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 12px}
@media (min-width:700px){.sheet{align-items:center}.sheet .kutu{border-radius:26px}}
@keyframes yuk{from{transform:translateY(30px)}to{transform:none}}
.sheet .bas{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;text-wrap:balance}
.sheet .govde{display:grid;gap:12px}
.sheet .govde > *,.blok > *,.kart > *{min-width:0}
.kart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:6px}
.secenekler{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.secenek{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:11px;display:grid;gap:3px}
.secenek.on{border-color:var(--accent);background:linear-gradient(180deg,rgba(255,107,74,.16),rgba(255,107,74,.05))}
.secenek .ad{font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.15}
.secenek .ac{font-size:12.5px;color:var(--muted);font-weight:600}
.secenek .rozet,.secenek .kod{justify-self:start}
.sekmeler{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.sekme{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:800;color:var(--muted)}
.sekme.on{background:var(--accent);border-color:var(--accent);color:#fff}
.secim{display:grid;gap:8px}
.secim button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px;display:grid;gap:2px}
.secim button:hover{border-color:var(--accent)}
.secim .e{font-weight:800}
.secim .d{font-size:13px;color:var(--muted);font-weight:600}
.rozet{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--card-2);color:var(--muted);letter-spacing:.02em}
.rozet.reklam{background:var(--gold);color:#2a1a00}
.rozet.uzman{background:rgba(255,194,75,.16);color:var(--gold)}
.kod{flex:0 0 auto;font-size:11px;font-weight:800;padding:4px 7px;border-radius:7px;background:var(--card-2);color:var(--muted);min-width:40px;text-align:center}
.metin{color:var(--muted);font-size:14px;font-weight:600;max-width:64ch}
.btn{border:0;border-radius:13px;padding:10px 14px;font-weight:800;background:var(--card-2);color:var(--ink);box-shadow:0 3px 0 var(--press)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--press)}
.btn.ana{background:linear-gradient(180deg,#ff8463,#ff5a3c);color:#fff;box-shadow:0 3px 0 var(--accent-d)}
.btn.cizgi{background:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.kucuk{padding:7px 11px;font-size:13px;border-radius:11px}
.buyuk{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text]{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.olasilik{height:8px;border-radius:4px;background:var(--bad);overflow:hidden}
.olasilik i{display:block;height:100%;background:var(--good)}
.v{font-weight:800}
.ad-ekran,.iflas{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--scrim);padding:24px}
.ad-ekran .kutu,.iflas .kutu{background:var(--bg-2);border:1px solid var(--line);border-radius:24px;padding:24px;width:min(420px,100%);text-align:center;display:grid;gap:10px}
.ad-sayac{font-family:var(--f-display);font-size:68px;font-weight:800;color:var(--gold);line-height:1}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:800;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
@media (max-width:400px){.firma{font-size:18px}.kasa{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <div class="ust-kap">
    <header class="ust">
      <div class="logo" id="logo" aria-hidden="true"></div>
      <div class="kimlik"><div class="firma" id="firma"></div><div class="unvan" id="unvan"></div></div>
      <div class="hiz" id="hiz" role="group" aria-label="Oyun hızı"><button data-hiz="0">Dur</button><button data-hiz="1">1×</button><button data-hiz="3">3×</button><button data-hiz="10">10×</button></div>
    </header>
    <section class="kasa-bar" aria-label="Kasa">
      <div><div class="kasa-et">Kasa</div><div class="kasa" id="kasa">0 ₺</div></div>
      <div class="cipler-ust" id="cipler"></div>
      <div class="ucanlar" id="ucanlar"></div>
    </section>
  </div>

  <main class="gorunum" id="v-merkez">
    <section class="hero">
      <canvas id="skyline" role="img" aria-label="Şirketinin şehir silüeti"></canvas>
      <div class="hero-ust"><span class="cam" id="hero-basamak"></span><span class="cam" id="hero-tarih"></span></div>
      <div class="hero-alt"><div class="hero-yazi"><span id="hero-hedef"></span><b id="hero-yuzde"></b></div><div class="bar"><i id="hero-bar"></i></div></div>
    </section>
    <div class="gorunum" id="merkez"></div>
  </main>

  for (const p of ps){ if (p.etud) saglam++; else { const d = (p.satilacak + p.kiralik) * birimFiyat(p) * 0.04 * KALITE[p.kalite].deprem; hasar += d; p.birimReal *= 0.9; } }
  const kapali = S.isletmeler.filter(b => b.sehir === c.id).reduce((a, b) => a + isletmeGelir(b), 0) * 3;
  log(`${c.ad}'da 5,8 büyüklüğünde deprem. İşletmeler 3 gün kapalı kaldı.`, 'kotu');
  if (kapali > 0) para(-kapali, 'Deprem nedeniyle kayıp ciro');
  if (hasar > 0){ para(-hasar, 'Zemin etüdü yapılmayan binalarda hasar onarımı'); S.itibar = clamp(S.itibar - 5, 0, 100); }
  if (saglam > 0){ S.itibar = clamp(S.itibar + 3, 0, 100); log(`Zemin etüdü yaptırdığın ${saglam} proje hasarsız atlattı. İtibar +3.`, 'iyi'); }
}

function ayKapat(){
  const ay = Math.floor((S.gun - 1) / 30) % 12, biten = AYLAR[(ay + 11) % 12];
  if (S.ayKar > 0){ const v = S.ayKar * 0.25; S.nakit -= v; log(`${biten} kapandı. Kâr ${tlk(S.ayKar)} · Kurumlar vergisi -${tlk(v)}`, 'not'); }
  else log(`${biten} zararla kapandı: ${tlk(S.ayKar)}. Vergi çıkmadı.`, 'kotu');
  S.ayKar = 0;
  for (const [id, s] of Object.entries(S.sehirler)){ const d = rnd(-0.02, 0.028); s.endeks *= 1 + d; s.degisim = d; }
  S.altinFiyat *= (1 + S.pi) * (1 + rnd(-0.04, 0.06));
  S.usdKur *= (1 + S.pi) * (1 + rnd(-0.025, 0.03));
  S.I *= 1 + S.pi;
  S.pi = clamp(S.pi + 0.3 * (0.025 - S.pi) + rnd(-0.006, 0.006), 0.008, 0.06);
  log(`${AYLAR[ay]} enflasyonu ${pct(S.pi)} · Kredi faizi yıllık ${pct(faizOrani())}`, 'not');
  if ((ay === 0 || ay === 6) && S.isletmeler.length){ const c = toplamGider() * 2; S.nakit -= c; log(`Asgari ücret zammı: çalışanlara fark ödemesi -${tlk(c)}`, 'kotu'); }
}

function solvency(){
  if (S.nakit >= 0){ if (S.negGun > 0){ S.negGun = 0; log('Kasa yeniden artıya geçti.', 'iyi'); } return; }
  S.negGun++;
  if (S.negGun === 1) log('Kasa ekside! 15 gün içinde toparlanmazsan iflas.', 'kotu');
  if (S.negGun >= 15){ S.iflas = true; clearInterval(timer); timer = null; log('İFLAS: Alacaklılar icraya verdi.', 'kotu'); iflasGoster(); }
}

function reklam(cb){ const el = $('#ad'); let k = 3; $('#ad-sayac').textContent = k; el.hidden = false; const t = setInterval(() => { k--; if (k <= 0){ clearInterval(t); el.hidden = true; cb(); } else $('#ad-sayac').textContent = k; }, 1000); }
let toastT;
function toast(m){ const el = $('#toast'); el.textContent = m; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

function sheetAc(baslik, html, bagla, zorunlu = false){
  sheetAcik = true; clearInterval(timer); timer = null;
  $('#sh-baslik').textContent = baslik; $('#sh-govde').innerHTML = html; $('#sh-kapat').hidden = zorunlu; $('#sheet').hidden = false;
  if (bagla) bagla($('#sh-govde'));
  renderUst();
}
function sheetKapat(){ $('#sheet').hidden = true; sheetAcik = false; hizAyarla(S.hiz); render(); }
$('#sh-kapat').onclick = sheetKapat;
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet' && !$('#sh-kapat').hidden) sheetKapat(); });
const kilitli = n => sheetAc('Kilitli', `<div class="metin">Bu bölüm ${BASAMAK[n - 1].ad} basamağında açılır. Üstteki basamaklardan ${BASAMAK[n - 1].ad} kaydına dokunarak hemen deneyebilirsin.</div>`);
const sehirSekme = (sec, attr) => `<div class="sekmeler">${acikSehirler().map(c => `<button class="sekme ${c.id === sec ? 'on' : ''}" data-${attr}="${c.id}">${c.ad}</button>`).join('')}</div>`;

function isletmeSheet(sehirId){
  const sec = sehirId || acikSehirler()[0].id, c = sehirBul(sec);
  const acik = TIP.filter(t => t.st <= S.st), sonraki = TIP.filter(t => t.st === S.st + 1).slice(0, 3);
  const satir = (t, kilit) => {
    const f = t.fiyat * c.pahali * S.I, uz = t.sektor === c.uzman;
    const nt = (t.gelir * c.pahali * c.talep * (uz ? 1.25 : 1) * sektorCarpan(t.sektor) * genelCarpan() - t.gider * c.pahali) * S.I;
    return `<div class="satir">${ikon(t.sektor)}<div class="ana-metin"><div class="b">${t.ad} ${uz ? '<span class="rozet uzman">şehrin uzmanlığı +%25</span>' : ''}</div><div class="s">${SEKTOR[t.sektor]} · Günlük net ${tlk(nt)} · Geri dönüş ~${Math.round(f / nt)} gün · Kurulum ${t.kur} gün${t.ac ? `<br><span class="iyi">${t.ac}</span>` : ''}</div></div>${kilit ? `<span class="rozet">${BASAMAK[t.st - 1].ek}</span>` : `<button class="btn ana kucuk" data-ac="${t.id}" ${S.nakit < f ? 'disabled' : ''}>${tlk(f)}</button>`}</div>`;
  };
  sheetAc('İşletme aç', `<div class="kv"><span>Kasa</span><b class="num">${tl(S.nakit)}</b></div>${sehirSekme(sec, 'sh')}
    <div class="metin">${c.ad}: fiyat seviyesi ×${dec(c.pahali, 2)}, talep ×${dec(c.talep, 2)}, uzmanlık ${SEKTOR[c.uzman]}.</div>
    <div class="liste">${acik.map(t => satir(t, false)).join('')}</div>
    ${sonraki.length ? `<hr class="ayrac"><div class="etiket">Sonraki basamakta açılacak</div><div class="liste">${sonraki.map(t => satir(t, true)).join('')}</div>` : ''}`,
    g => {
      g.querySelectorAll('[data-sh]').forEach(b => b.onclick = () => isletmeSheet(b.dataset.sh));
      g.querySelectorAll('[data-ac]').forEach(b => b.onclick = () => { const t = tipBul(b.dataset.ac), f = t.fiyat * c.pahali * S.I; if (S.nakit < f) return; S.nakit -= f; ucan('-' + tlk(f), 'kotu'); S.isletmeler.push({id:S.nid++, tip:t.id, sehir:sec, lv:1, kalan:t.kur}); if (t.itibar) S.itibar = clamp(S.itibar + t.itibar, 0, 100); log(`${c.ad}'de ${t.ad} kuruluyor (${t.kur} gün): -${tlk(f)}`, 'not'); toast(`${t.ad}: kurulum başladı`); isletmeSheet(sec); render(); });
    });
}

function yonetSheet(sehirId){

function sehirSheet(){
  const limit = B().sehir, acikSay = acikSehirler().length;
  sheetAc('Şehirler', `<div class="kv"><span>Açık şube</span><b>${acikSay} / ${limit}</b></div><div class="metin">Her şehrin fiyat seviyesi, talebi ve uzmanlığı farklı. Uzman olduğu sektördeki işletmeler %25 fazla kazanır. Konut fiyat endeksi her ay değişir.</div>
    <div class="liste">${SEHIR.map(c => { const s = S.sehirler[c.id], f = c.sube * S.I, say = S.isletmeler.filter(b => b.sehir === c.id).length;
      return `<div class="satir"><div class="ana-metin"><div class="b">${c.ad} <span class="rozet uzman">${SEKTOR[c.uzman]}</span></div><div class="s">Fiyat ×${dec(c.pahali, 2)} · Talep ×${dec(c.talep, 2)}${s ? ` · Konut endeksi ${dec(s.endeks, 2)} <span class="${s.degisim >= 0 ? 'iyi' : 'kotu'}">${s.degisim >= 0 ? '▲' : '▼'} ${pct(Math.abs(s.degisim))}</span> · ${say} işletme` : ''}</div></div>${s ? '<span class="rozet">Şube açık</span>' : c.st > S.st ? `<span class="rozet">${BASAMAK[c.st - 1].ek}</span>` : `<button class="btn ana kucuk" data-sube="${c.id}" ${acikSay >= limit || S.nakit < f ? 'disabled' : ''}>Şube aç ${tlk(f)}</button>`}</div>`; }).join('')}</div>`,
    g => g.querySelectorAll('[data-sube]').forEach(b => b.onclick = () => { const c = sehirBul(b.dataset.sube), f = c.sube * S.I; if (S.nakit < f || acikSehirler().length >= B().sehir) return; S.nakit -= f; S.sehirler[c.id] = {endeks:1, degisim:0}; log(`${c.ad} şubesi açıldı: -${tlk(f)}`, 'iyi'); toast(`${c.ad} şubesi açıldı`); sehirSheet(); render(); }));
}

function insaatSheet(o){
  o = o || {sehir:acikSehirler()[0].id, tip:PROJE.filter(p => p.st <= S.st).slice(-1)[0].id, kalite:'standart', etud:true};
  const c = sehirBul(o.sehir), t = projeBul(o.tip), k = KALITE[o.kalite], e = S.sehirler[o.sehir].endeks;
  const arsa = t.arsa * Math.pow(c.pahali, 1.3) * e * S.I, yapim = t.yapim * k.m * (1 - insaatIndirim()) * S.I, etud = o.etud ? (arsa + yapim) * 0.02 : 0, top = arsa + yapim + etud;
  const birim = (t.arsa * Math.pow(c.pahali, 1.3) + t.yapim) * 1.32 / t.birim * k.d * e * S.I;
  const dolu = aktifSantiye() >= B().santiye;
  const tipler = PROJE.map(p => `<button class="secenek ${p.id === o.tip ? 'on' : ''}" data-tip="${p.id}" ${p.st > S.st ? 'disabled' : ''}><span class="ad">${p.ad}</span><span class="ac">${p.kiralik ? 'Mağazalar kiraya verilir' : p.birim + ' birim'} · ${p.gun} gün</span>${p.st > S.st ? `<span class="rozet">${BASAMAK[p.st - 1].ek}</span>` : ''}</button>`).join('');
  const kal = Object.entries(KALITE).map(([id, x]) => `<button class="secenek ${id === o.kalite ? 'on' : ''}" data-kal="${id}"><span class="ad">${x.ad}</span><span class="ac">${x.ac}</span></button>`).join('');
  const kar = t.kiralik ? null : birim * t.birim - top;
  sheetAc('İnşaat projesi', `<div class="kv"><span>Şantiyeler</span><b class="${dolu ? 'kotu' : ''}">${aktifSantiye()} / ${B().santiye} dolu</b></div>
    <div><div class="etiket">Şehir</div>${sehirSekme(o.sehir, 'is')}</div>
    <div><div class="etiket">Proje</div><div class="secenekler">${tipler}</div></div>
    <div><div class="etiket">Kalite</div><div class="secenekler">${kal}</div></div>
    <label class="satir"><input type="checkbox" id="etud" ${o.etud ? 'checked' : ''}><span class="ana-metin"><span class="b">Zemin etüdü yaptır (+%2)</span><div class="s">Yaptırmazsan inşaatın ortasında %30 ihtimalle temel sorunu çıkar (+%12 maliyet, 8 gün gecikme) ve depremde bina hasar görür.</div></span></label>
    <div class="kart"><div class="kv"><span>Arsa (${c.ad}, endeks ${dec(e, 2)})</span><b class="num">${tl(arsa)}</b></div>
      <div class="kv"><span>Yapım${insaatIndirim() ? ` (indirim -%${Math.round(insaatIndirim() * 100)})` : ''}</span><b class="num">${tl(yapim)}</b></div>
      ${o.etud ? `<div class="kv"><span>Zemin etüdü</span><b class="num">${tl(etud)}</b></div>` : ''}
      <div class="kv"><span>Toplam maliyet</span><b class="num">${tl(top)}</b></div>
      <div class="kv"><span>${t.kiralik ? 'Bina değeri' : 'Bugünkü birim satış değeri'}</span><b class="num">${tlk(birim)}</b></div>
      ${t.kiralik ? `<div class="kv"><span>Tahmini kira geliri</span><b class="num iyi">${tlk(birim * 0.075 / 360)} / gün</b></div>` : `<div class="kv"><span>Tahmini kâr (vergi öncesi)</span><b class="num ${kar >= 0 ? 'iyi' : 'kotu'}">${isaret(kar)}</b></div>`}</div>
    <button class="btn ana" id="temel" ${dolu || S.nakit < top ? 'disabled' : ''}>${dolu ? 'Bütün şantiyeler dolu' : 'Temel at'}</button>`,
    g => {
      g.querySelectorAll('[data-is]').forEach(b => b.onclick = () => { o.sehir = b.dataset.is; insaatSheet(o); });
      g.querySelectorAll('[data-tip]').forEach(b => b.onclick = () => { o.tip = b.dataset.tip; insaatSheet(o); });
      g.querySelectorAll('[data-kal]').forEach(b => b.onclick = () => { o.kalite = b.dataset.kal; insaatSheet(o); });
      g.querySelector('#etud').onchange = ev => { o.etud = ev.target.checked; insaatSheet(o); };
      g.querySelector('#temel').onclick = () => { const p = projeOlustur(o.tip, o.sehir, o.kalite, o.etud, S.I); p.maliyetNom = top; S.nakit -= top; ucan('-' + tlk(top), 'kotu'); S.projeler.push(p); log(`${c.ad}'da ${t.ad} için temel atıldı (${k.ad}${o.etud ? ', zemin etüdlü' : ''}): -${tlk(top)}`, 'not'); toast('Temel atıldı'); sheetKapat(); };
    });
}

function satisSheet(){
  const L = S.projeler.filter(p => p.durum === 'satis');
  const kira = S.projeler.filter(p => p.kiralik > 0);
  const teklifHtml = S.teklifler.length ? `<div class="etiket">Alıcı teklifleri</div>${S.teklifler.map(t => { const pr = S.projeler.find(x => x.id === t.pid), ps = PERSONA[t.per]; if (!pr) return ''; const f = birimFiyat(pr) * t.oran, k = Math.min(t.adet, pr.satilacak);

    ${L.length ? L.map(p => { const t = projeBul(p.tip), c = sehirBul(p.sehir); return `<div class="kart" data-proje="${p.id}">

      <div class="kv"><span>Fiyat (piyasaya göre <b data-o>${p.fiyatOran >= 1 ? '+' : ''}${pct(p.fiyatOran - 1, 0)}</b>)</span><b class="num" data-f>${tlk(birimFiyat(p) * p.fiyatOran)}</b></div>
      <input type="range" min="0.85" max="1.25" step="0.01" value="${p.fiyatOran}" data-fiyat="${p.id}" aria-label="Satış fiyatı">
      <div class="kv"><span>Tahmini satış</span><b data-h>${dec(satisHizi(p) * p.satilacak, 2)} / gün</b></div>
      <div class="ikili"><button class="btn kucuk" data-one="${p.id}" ${p.one ? 'disabled' : ''}><span class="rozet reklam">Reklam</span> İlanı öne çıkar</button><button class="btn kucuk" data-kira="${p.id}">Kalanları kiraya ver</button></div></div>`; }).join('') : '<div class="bos">Satışta proje yok. Bir inşaat bitince burada görünür.</div>'}
    ${kira.length ? `<hr class="ayrac"><div class="etiket">Kiradaki mülkler</div>${kira.map(p => `<div class="kv"><span>${sehirBul(p.sehir).ad} · ${projeBul(p.tip).ad} (${p.kiralik} birim)</span><b class="num iyi">${tlk(p.kiralik * birimFiyat(p) * (projeBul(p.tip).kiralik ? 0.075 : 0.065) / 360)} / gün</b></div>`).join('')}` : ''}`,
    g => {
      g.querySelectorAll('[data-tkabul]').forEach(b => b.onclick = () => { const t = S.teklifler.find(x => x.id === +b.dataset.tkabul); if (t) teklifKabul(t); satisSheet(); render(); });
      g.querySelectorAll('[data-tpaz]').forEach(b => b.onclick = () => { const t = S.teklifler.find(x => x.id === +b.dataset.tpaz); if (!t) return; const ps = PERSONA[t.per]; if (Math.random() < ps.p){ t.oran = Math.min(1.15, t.oran + 0.05); t.pazarlik = true; log(`${ps.ad} pazarlığı kabul etti, teklif yükseldi.`, 'iyi'); toast('Teklif yükseldi'); } else { S.teklifler = S.teklifler.filter(x => x !== t); log(`${ps.ad} pazarlıktan sonra vazgeçti.`, 'kotu'); toast('Alıcı vazgeçti'); } satisSheet(); render(); });
      g.querySelectorAll('[data-tred]').forEach(b => b.onclick = () => { S.teklifler = S.teklifler.filter(x => x.id !== +b.dataset.tred); satisSheet(); render(); });
      g.querySelectorAll('[data-fiyat]').forEach(r => r.oninput = () => { const p = S.projeler.find(x => x.id === +r.dataset.fiyat); p.fiyatOran = +r.value; const kart = r.closest('.kart'); kart.querySelector('[data-o]').textContent = (p.fiyatOran >= 1 ? '+' : '') + pct(p.fiyatOran - 1, 0); kart.querySelector('[data-f]').textContent = tlk(birimFiyat(p) * p.fiyatOran); kart.querySelector('[data-h]').textContent = dec(satisHizi(p) * p.satilacak, 2) + ' / gün'; });
      g.querySelectorAll('[data-one]').forEach(b => b.onclick = () => reklam(() => { const p = S.projeler.find(x => x.id === +b.dataset.one); p.one = 5; log(`${projeBul(p.tip).ad} ilanı 5 gün öne çıkarıldı.`, 'not'); satisSheet(); }));

    });
}

function sirketSheet(){
  const limit = B().sirket, kurulu = Object.keys(S.sirketler).length, ucret = 2e6 * S.I * S.st;
  const sektorler = Object.keys(SEKTOR).filter(s => s === 'insaat' || S.isletmeler.some(b => tipBul(b.tip).sektor === s));
  sheetAc('Şirketler', `<div><div class="etiket">Grubun adı</div><div class="satir"><input type="text" id="grup-adi" maxlength="18" value="${S.ad}" aria-label="Grup adı"><button class="btn kucuk" id="ad-kaydet">Kaydet</button></div></div>
    <div class="metin">Aynı sektörde 3 işletmen olunca o sektörün şirketini kurabilirsin: sektör geliri +%10. Yapı şirketi için 2 tamamlanmış iş gerekir; inşaat maliyetini %5 düşürür, satışı %10 hızlandırır. Holding basamağında şirketlere CEO atanır: +%15 gelir, maaşı sektör cirosunun %4'ü.</div>
    <div class="kv"><span>Kurulu şirket</span><b>${kurulu} / ${limit}</b></div>
    <div class="liste">${sektorler.map(s => { const say = s === 'insaat' ? S.tamam : S.isletmeler.filter(b => tipBul(b.tip).sektor === s).length, gerek = s === 'insaat' ? 2 : 3, sk = S.sirketler[s];
      return `<div class="satir">${ikon(s)}<div class="ana-metin"><div class="b">${sk ? `${S.ad} ${SEKTOR[s]} A.Ş.` : SEKTOR[s]}</div><div class="s">${s === 'insaat' ? `${say} tamamlanmış iş` : `${say} işletme · günlük ciro ${tlk(sektorGelir(s))}`}${sk ? ` · +%${sk.ceo ? 25 : 10}` : ''}</div></div>
        ${sk ? (S.st >= 4 && s !== 'insaat' && !sk.ceo ? `<button class="btn ana kucuk" data-ceo="${s}">CEO ata</button>` : `<span class="rozet">${sk.ceo ? 'CEO var' : 'Kurulu'}</span>`) : `<button class="btn ana kucuk" data-kur="${s}" ${say < gerek || kurulu >= limit || S.nakit < ucret ? 'disabled' : ''}>Kur ${tlk(ucret)}</button>`}</div>`; }).join('')}</div>`,
    g => {
      g.querySelector('#ad-kaydet').onclick = () => { const v = g.querySelector('#grup-adi').value.trim(); if (v){ S.ad = v; log(`Grubun yeni adı: ${firmaAdi()}`, 'not'); render(); sirketSheet(); } };
      g.querySelectorAll('[data-kur]').forEach(b => b.onclick = () => { const s = b.dataset.kur; if (S.nakit < ucret) return; S.nakit -= ucret; S.sirketler[s] = {ceo:false}; log(`Ticaret sicil: ${S.ad} ${SEKTOR[s]} A.Ş. kuruldu. -${tlk(ucret)}`, 'iyi'); toast(`${S.ad} ${SEKTOR[s]} A.Ş.`); sirketSheet(); render(); });
      g.querySelectorAll('[data-ceo]').forEach(b => b.onclick = () => { S.sirketler[b.dataset.ceo].ceo = true; log(`${SEKTOR[b.dataset.ceo]} şirketine CEO atandı.`, 'not'); sirketSheet(); render(); });
    });
}

function ihaleOlasilik(ih, b){ const be = b * (1 - S.itibar / 1000); return ih.rakipler.reduce((p, r) => p * (1 - Phi((be - ih.M * (1 + r.m)) / (ih.M * r.s))), 1); }
function ihaleUret(){
  const boylar = [{ad:'Küçük', k:5, sure:15, r:[2, 3]}, {ad:'Orta', k:10, sure:30, r:[3, 5]}, {ad:'Büyük', k:20, sure:50, r:[4, 6]}];
  return boylar.map(b => { const M = Math.max(gelir(), 50e3 * S.I) * b.k * rnd(0.85, 1.2); const k = b.r[0] + Math.floor(Math.random() * (b.r[1] - b.r[0] + 1)); const adlar = [...RAKIPLER].sort(() => Math.random() - 0.5).slice(0, k);
    return {ad:pick(IHALE_ADLARI[Math.min(S.st, 5)]), boy:b.ad, sure:b.sure, M, rakipler:adlar.map(ad => ({ad, m:rnd(0.05, 0.3), s:rnd(0.05, 0.12)})), intel:false, oran:1.2, sonuc:null}; });
}
function ihaleSheet(sec = null){
  if (S.st < 2) return kilitli(2);
  if (!S.ihaleler.length){ S.ihaleler = ihaleUret(); S.ihaleCd = 15; }
  const pano = `<div class="secenekler">${S.ihaleler.map((x, i) => `<button class="secenek ${sec === i ? 'on' : ''}" data-ih="${i}" ${x.sonuc ? 'disabled' : ''}><span class="rozet">${x.boy} · ${x.sure} gün</span><span class="ad">${x.ad}</span><span class="ac">Yaklaşık maliyet ${tlk(x.M)} · ${x.rakipler.length} rakip</span>${x.sonuc ? `<span class="${x.sonuc.k}">${x.sonuc.t}</span>` : ''}</button>`).join('')}</div>`;
  const ust = `<div class="metin">Kamu İhale Bülteni. En düşük teklif kazanır; gerçek maliyet yaklaşık maliyetten %8 düşük ile %15 yüksek arasında çıkabilir. İtibarın puanlamada %${dec(S.itibar / 10, 1)} avantaj sağlar. Yeni ilanlar ${S.ihaleCd} gün sonra.</div>${pano}`;
  if (sec === null || S.ihaleler[sec].sonuc){ sheetAc('İhaleler', ust + '<div class="metin">Teklif vermek için bir ilan seç.</div>', g => g.querySelectorAll('[data-ih]').forEach(b => b.onclick = () => ihaleSheet(+b.dataset.ih))); return; }
  const ih = S.ihaleler[sec];
  const yaz = g => { const b = ih.M * ih.oran, p = ihaleOlasilik(ih, b), ev = p * (b - 1.035 * ih.M); g.querySelector('#ih-b').textContent = tl(b); g.querySelector('#ih-p').textContent = pct(p, 0); g.querySelector('#ih-bar').style.width = (p * 100) + '%'; const e = g.querySelector('#ih-ev'); e.textContent = isaret(ev); e.className = 'v ' + (ev >= 0 ? 'iyi' : 'kotu'); g.querySelector('#ih-m').textContent = pct(ih.oran - 1, 0); };
  sheetAc('İhaleler', `${ust}<div class="buyuk">${ih.ad}</div>
    <div class="kart"><div class="etiket">${ih.rakipler.length} firma zarf verdi</div>${ih.intel ? ih.rakipler.map(r => `<div class="kv"><span>${r.ad}</span><b class="num">${tlk(ih.M * (1 + r.m - r.s))} – ${tlk(ih.M * (1 + r.m + r.s))}</b></div>`).join('') : `<div class="metin">Rakiplerin teklif aralığını bilmiyorsun.</div><button class="btn kucuk" id="intel"><span class="rozet reklam">Reklam</span> Kulis bilgisi al</button>`}</div>
    <div><div class="kv"><span>Teklifin (kâr marjı <b id="ih-m"></b>)</span><b class="num" id="ih-b"></b></div><input type="range" id="teklif" min="0.85" max="1.6" step="0.005" value="${ih.oran}" aria-label="Teklif tutarı"></div>
    <div class="ikili"><div class="stat"><div class="k">Kazanma ihtimali</div><div class="v" id="ih-p"></div><div class="olasilik" style="margin-top:6px"><i id="ih-bar"></i></div></div><div class="stat"><div class="k">Beklenen kâr</div><div class="v" id="ih-ev"></div></div></div>
    <button class="btn ana" id="zarf">Zarfı teslim et</button>`,
    g => {
      yaz(g);
      g.querySelector('#teklif').oninput = e => { ih.oran = +e.target.value; yaz(g); };
      const intel = g.querySelector('#intel'); if (intel) intel.onclick = () => reklam(() => { ih.intel = true; ihaleSheet(sec); });
      g.querySelectorAll('[data-ih]').forEach(b => b.onclick = () => ihaleSheet(+b.dataset.ih));
      g.querySelector('#zarf').onclick = () => {
        const b = ih.M * ih.oran, be = b * (1 - S.itibar / 1000);
        const en = ih.rakipler.map(r => ({ad:r.ad, b:ih.M * (1 + r.m) + ih.M * r.s * randn()})).reduce((a, c) => c.b < a.b ? c : a);
        if (be < en.b){ S.isler.push({tur:'ihale', ad:ih.ad, kalan:ih.sure, toplam:ih.sure, b, M:ih.M * (1 + rnd(-0.08, 0.15))}); ih.sonuc = {t:`Kazandın: ${tlk(b)}`, k:'iyi'}; log(`İhaleyi kazandın: ${ih.ad} (${tlk(b)}).`, 'iyi'); toast('İhale senin!'); }
        else { ih.sonuc = {t:`${en.ad} aldı: ${tlk(en.b)}`, k:'kotu'}; log(`İhaleyi ${en.ad} kazandı (${tlk(en.b)}).`, 'kotu'); toast(`İhaleyi ${en.ad} aldı`); }
        ihaleSheet(null); render();
      };
    });
}

    <div class="kart"><div class="etiket">Gram altın</div><div class="kv"><span>Fiyat</span><b class="num">${tl(S.altinFiyat)}</b></div><div class="kv"><span>Sende</span><b class="num">${fmtInt(S.altin)} gr (${tlk(S.altin * S.altinFiyat)})</b></div><div class="metin">Kuyumcu makası %1,5.</div>

function kartAc(){
  const g = Math.max(gelir(), 20e3 * S.I);
  const K = [
    {st:1, f:() => { const X = Math.max(40e3 * S.I, g * 1.2); return {b:'Kayınbiraderin iş istiyor', m:'Eşinin kardeşi "abi beni de bir yere koy" diyor. Masa başı bir iş, ama ne kadar çalışkan olduğu meçhul.', s:[
      {e:'İşe al', d:`Maaş -${tlk(X)} · %50 cevher çıkar (+${tlk(g * 4)}, itibar +5) · %50 kasadan eksik çıkar (-${tlk(g * 3)})`, fn:() => { para(-X, 'Kayınbiradere maaş'); if (Math.random() < 0.5){ para(g * 4, 'Kayınbirader büyük müşteri getirdi'); S.itibar = clamp(S.itibar + 5, 0, 100); } else para(-g * 3, 'Kayınbiraderin kasa açığı'); }},
      {e:'Kibarca reddet', d:'Aile biraz küser: itibar -2', fn:() => { S.itibar = clamp(S.itibar - 2, 0, 100); log('Bayramda sofrada soğuk hava esti. İtibar -2.', 'kotu'); }}]}; }},
    {st:1, f:() => { const X = Math.max(30e3 * S.I, g * 0.8); return {b:'İş güvenliği denetimi', m:'Müfettiş işletmelerde eksik yangın tüpü ve acil çıkış tabelası tespit etti.', s:[
      {e:'Eksikleri hemen gider', d:`-${tlk(X)}`, fn:() => para(-X, 'İş güvenliği önlemleri')},
      {e:'Sonraya bırak', d:`%40 ihtimalle ceza -${tlk(X * 4)}`, fn:() => Math.random() < 0.4 ? para(-X * 4, 'İş güvenliği cezası') : log('Müfettiş bu sefer uyarıyla geçti.', 'not')},
      {e:'Danışman tut', d:`Maliyet yarıya iner (-${tlk(X / 2)})`, reklam:true, fn:() => para(-X / 2, 'İSG danışmanı eksikleri ucuza çözdü')}]}; }},
    {st:1, f:() => { const A = Math.max(150e3 * S.I, g * 6); return {b:'Vadeli toptan sipariş', m:`Bir otel zinciri 90 gün vadeli büyük sipariş veriyor. Vade sonunda ${tlk(A)} tahsilat.`, s:[
      {e:'Kabul et', d:`90 gün sonra +${tlk(A)} · %10 batma riski`, fn:() => { S.isler.push({tur:'alacak', ad:'Otel zinciri alacağı', kalan:90, toplam:90, tutar:A}); log('Vadeli sipariş kabul edildi.', 'not'); }},
      {e:'Peşin olmazsa olmaz', d:'Risk yok, kazanç yok', fn:() => log('Vadeli sipariş reddedildi.', 'not')}]}; }},
    {st:2, f:() => { const c = pick(acikSehirler()), t = PROJE.filter(p => p.st <= S.st && !p.kiralik && p.birim > 1 && p.yapim * (1 - insaatIndirim()) * S.I * 1.02 <= S.nakit * 0.8).slice(-1)[0]; if (!t || aktifSantiye() >= B().santiye) return null; const yap = t.yapim * (1 - insaatIndirim()) * S.I; return {b:'Kat karşılığı teklifi', m:`${c.ad}'da bir arsa sahibi "${t.ad} yap, dairelerin yarısı benim" diyor. Arsa parası ödemezsin, sadece yapım maliyeti senden.`, s:[
      {e:'Anlaş ve temel at', d:`Yapım -${tlk(yap)} · ${Math.floor(t.birim / 2)} birim senin`, fn:() => { if (aktifSantiye() >= B().santiye || S.nakit < yap * 1.02){ log('Şantiye ya da kasa uygun olmadığı için kat karşılığı fırsatı kaçtı.', 'kotu'); return; } const p = projeOlustur(t.id, c.id, 'standart', true, S.I); p.birim = Math.floor(t.birim / 2); p.satilacak = p.birim; p.maliyetNom = yap * 1.02; p.maliyetReal = p.maliyetNom / S.I; S.nakit -= p.maliyetNom; S.projeler.push(p); log(`Kat karşılığı: ${c.ad} ${t.ad} için temel atıldı. -${tlk(p.maliyetNom)}`, 'iyi'); }},
      {e:'Reddet', d:'Şantiyeler boş kalsın', fn:() => log('Kat karşılığı teklifi reddedildi.', 'not')}]}; }},
    {st:2, f:() => { const X = Math.max(200e3 * S.I, g * 3); return {b:'Ünlü fenomenden reklam teklifi', m:'Milyonlarca takipçisi olan bir fenomen, projelerini ve işletmelerini tanıtmak istiyor.', s:[
      {e:'Anlaş', d:`-${tlk(X)} · 20 gün satışlar %50 hızlı · itibar +3`, fn:() => { para(-X, 'Fenomen reklamı'); S.kampanya = Math.max(S.kampanya, 20); S.itibar = clamp(S.itibar + 3, 0, 100); }},
      {e:'Geç', d:'Değişiklik yok', fn:() => log('Fenomen teklifi geri çevrildi.', 'not')}]}; }},
    {st:2, f:() => S.projeler.some(p => p.durum === 'insaat') ? (() => { const p = S.projeler.find(x => x.durum === 'insaat'), X = Math.max(100e3 * S.I, p.maliyetReal * S.I * 0.03); return {b:'Komşular mahkemeye gitti', m:`${sehirBul(p.sehir).ad}'daki ${projeBul(p.tip).ad} şantiyesi için yürütmeyi durdurma davası açıldı.`, s:[
      {e:'Uzlaş, tazminat öde', d:`-${tlk(X)}`, fn:() => para(-X, 'Komşulara uzlaşma bedeli')},
      {e:'Dava sürsün', d:'Şantiye 15 gün durur', fn:() => { p.kalan += 15; log('Şantiye mahkeme kararıyla 15 gün durdu.', 'kotu'); }},
      {e:'İyi avukat tut', d:'Dava düşer, gecikme yok', reklam:true, fn:() => log('Avukat davayı ilk duruşmada düşürdü.', 'iyi')}]}; })() : null},
    {st:3, f:() => { const G = g * 3, C = g * 15; return {b:'İmar artışı için "bağış"', m:'Bir aracı, arsalarının imarını artırmak için belediyedeki tanıdığına "bağış" yapılmasını öneriyor.', s:[
      {e:'Kabul et', d:`Şimdi +${tlk(G)} · %55 soruşturma: -${tlk(C)} ve itibar -20`, fn:() => { para(G, 'İmar artışıyla arsa değerlendi'); S.isler.push({tur:'sorusturma', ad:'İmar soruşturması', kalan:60, toplam:60, ceza:C}); }},
      {e:'Reddet ve bildir', d:'İtibar +6', fn:() => { S.itibar = clamp(S.itibar + 6, 0, 100); log('Teklifi bildirdin. İtibar +6.', 'iyi'); }}]}; }},
  ].filter(k => k.st <= S.st);
  let kart = null;
  for (let i = 0; i < 8 && !kart; i++) kart = pick(K).f();
  if (!kart) return;
  sheetAc(kart.b, `<div class="metin">${kart.m}</div><div class="secim">${kart.s.map((s, i) => `<button data-s="${i}"><span class="e">${s.reklam ? '<span class="rozet reklam">Reklam</span> ' : ''}${s.e}</span><span class="d">${s.d}</span></button>`).join('')}</div>`,
    gv => gv.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { const s = kart.s[+b.dataset.s]; const bitir = () => { s.fn(); sheetKapat(); }; s.reklam ? reklam(bitir) : bitir(); }), true);

function seeded(seed){ let s = Math.abs(Math.floor(seed)) % 2147483647 || 1; return () => (s = s * 16807 % 2147483647) / 2147483647; }
const PROJE_BOY = {mustakil:24, apt4:46, apt10:70, site:58, rezidans:112, avm:44, gokdelen:150, kentsel:78};
let sky = {imza:''};
function skyHazirla(W, H){
  const imza = [W, H, S.st, S.isletmeler.map(b => b.id + '.' + b.lv + (b.kalan ? 'k' : '')).join(','), S.projeler.map(p => p.id + p.durum).join(',')].join('|');
  if (sky.imza === imza) return;
  const zemin = H - 26, r = seeded(4242 + S.st * 97);
  const yildiz = Array.from({length:70}, () => [r() * W, r() * zemin * 0.65, r() * 1.3 + 0.3, r() * 6]);
  const arka = Array.from({length:12 + S.st * 6}, () => { const w = 12 + r() * 26; return {x:r() * (W + 20) - 20, w, h:18 + r() * (22 + S.st * 15)}; }).sort((a, b) => b.h - a.h);
  const ogeler = [
    ...S.isletmeler.map(b => { const t = tipBul(b.tip); return {id:b.id, h:(16 + 8 * Math.log2(t.fiyat / 1e5 + 1) + b.lv * 3) * (1 + S.st * 0.08), renk:RENK[t.sektor], insaat:b.kalan > 0, ilerleme:b.kalan > 0 ? 1 - b.kalan / t.kur : 1, genis:false}; }),
    ...S.projeler.map(p => ({id:p.id + 100000, h:PROJE_BOY[p.tip], renk:RENK.insaat, insaat:p.durum === 'insaat', ilerleme:p.durum === 'insaat' ? 1 - p.kalan / p.toplam : 1, genis:['avm', 'site', 'kentsel'].includes(p.tip), proje:true})),
  ].slice(-36);
  const adim = W / (ogeler.length + 1);
  ogeler.forEach((o, i) => {
    const rr = seeded(o.id * 7919 + 17);
    o.w = o.genis ? 40 + rr() * 18 : 14 + rr() * 12 + (o.proje ? 8 : 0);
    o.h = Math.min(o.h, zemin - 34);
    o.x = adim * (i + 1) - o.w / 2 + (rr() - 0.5) * adim * 0.6;
    o.pencere = [];
    const sut = Math.max(1, Math.floor((o.w - 4) / 6)), sat = Math.max(1, Math.floor((o.h - 6) / 7));
    for (let c = 0; c < sut; c++) for (let k = 0; k < sat; k++) if (rr() < 0.62) o.pencere.push([3 + c * 6, 5 + k * 7, rr() * 50]);
  });
  ogeler.sort((a, b) => b.h - a.h);
  sky = {imza, zemin, yildiz, arka, ogeler};
}
function skyCiz(t){

  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = '#ffffff';

  x.globalAlpha = 1;
  const mx = W * 0.82, my = 44;
  const mg = x.createRadialGradient(mx, my, 4, mx, my, 50); mg.addColorStop(0, 'rgba(255,236,200,.5)'); mg.addColorStop(1, 'rgba(255,236,200,0)');
  x.fillStyle = mg; x.fillRect(mx - 55, my - 55, 110, 110);
  x.fillStyle = '#fff3d6'; x.beginPath(); x.arc(mx, my, 13, 0, 7); x.fill();
  x.fillStyle = '#2b1d60'; x.beginPath(); x.moveTo(W * 0.02, z); x.lineTo(W * 0.3, z - 100); x.lineTo(W * 0.64, z); x.closePath(); x.fill();
  x.fillStyle = 'rgba(255,255,255,.6)'; x.beginPath(); x.moveTo(W * 0.3, z - 100); x.lineTo(W * 0.265, z - 82); x.lineTo(W * 0.285, z - 85); x.lineTo(W * 0.305, z - 79); x.lineTo(W * 0.338, z - 83); x.closePath(); x.fill();
  x.fillStyle = '#1d1750'; for (const b of sky.arka) x.fillRect(b.x, z - b.h, b.w, b.h);
  x.fillStyle = 'rgba(255,214,128,.18)'; for (const b of sky.arka) for (let yy = z - b.h + 6; yy < z - 4; yy += 9) x.fillRect(b.x + 3, yy, Math.max(2, b.w - 6), 1);
  for (const o of sky.ogeler){
    const top = z - o.h;
    if (o.insaat){
      const dolu = o.h * Math.max(0.08, o.ilerleme);
      x.fillStyle = '#2a2c66'; x.fillRect(o.x, z - dolu, o.w, dolu);
      x.strokeStyle = 'rgba(255,176,58,.8)'; x.lineWidth = 1; x.strokeRect(o.x + 0.5, top + 0.5, o.w - 1, o.h - 1);
      for (let yy = top + 7; yy < z; yy += 7){ x.beginPath(); x.moveTo(o.x, yy + 0.5); x.lineTo(o.x + o.w, yy + 0.5); x.stroke(); }
      const kx = o.x + o.w + 4, ky = top - 18;
      x.strokeStyle = '#ffb03a'; x.lineWidth = 2; x.beginPath(); x.moveTo(kx, z); x.lineTo(kx, ky); x.lineTo(kx - o.w - 14, ky); x.moveTo(kx, ky); x.lineTo(kx + 10, ky); x.stroke();

  }

}

    ${kira.length ? `<section class="blok"><div class="blok-bas"><h2>Kiradakiler</h2></div>${kira.map(p => kart(p, {alt:`<div class="kv"><span>${p.kiralik} birim kirada</span><b class="iyi">${isaret(p.kiralik * birimFiyat(p) * (projeBul(p.tip).kiralik ? 0.075 : 0.065) / 360)} / gün</b></div>`})).join('')}</section>` : ''}`;
}

function renderSirket(){
  const sektorler = Object.keys(SEKTOR).filter(s => s !== 'insaat' && S.isletmeler.some(b => tipBul(b.tip).sektor === s));
  $('#v-sirket').innerHTML = `<h2 class="baslik">Şirketler</h2>
    <section class="blok"><div class="grup-kart"><div class="logo">${S.ad.slice(0, 2).toLocaleUpperCase('tr')}</div><div class="ana-metin" style="min-width:0"><div class="buyuk">${firmaAdi()}</div><div class="ipucu">${B().unvan} · ${Object.keys(S.sirketler).length}/${B().sirket} şirket · itibar ${Math.round(S.itibar)}/100</div>${S.yildiz ? `<div class="yildizlar">★ ${S.yildiz} hisse yıldızı · gelir +%${S.yildiz * 5}</div>` : ''}</div></div>
      <div class="ucuz"><button class="oyun-btn mercan kucuk" data-git="sirketler">Şirket kur</button><button class="oyun-btn kucuk" data-git="statu" ${S.st < 2 ? 'disabled' : ''}>Statü</button><button class="oyun-btn altin kucuk" data-git="halkaarz" ${S.st < 5 ? 'disabled' : ''}>Halka arz</button></div></section>
    <section class="blok"><div class="blok-bas"><h2>Sektörler</h2><span class="ipucu">3 işletme = şirket hakkı</span></div>
      <div class="liste">${sektorler.map(s => { const say = S.isletmeler.filter(b => tipBul(b.tip).sektor === s).length, sk = S.sirketler[s]; return `<div class="satir">${ikon(s, true)}<div class="ana-metin"><div class="b">${sk ? `${S.ad} ${SEKTOR[s]} A.Ş.` : SEKTOR[s]}</div><div class="s">${say} işletme · ${tlk(sektorGelir(s))} günlük ciro</div><div class="bar ince" style="margin-top:5px"><i style="width:${Math.min(1, say / 3) * 100}%"></i></div></div><span class="rozet ${sk ? 'uzman' : ''}">${sk ? (sk.ceo ? 'CEO · +%25' : 'Şirket · +%10') : say >= 3 ? 'Kurulabilir' : `${say}/3`}</span></div>`; }).join('') || '<div class="bos">Henüz işletme yok.</div>'}
      <div class="satir">${ikon('insaat', true)}<div class="ana-metin"><div class="b">${S.sirketler.insaat ? `${S.ad} Yapı A.Ş.` : 'Yapı'}</div><div class="s">${S.tamam} tamamlanmış iş</div></div><span class="rozet ${S.sirketler.insaat ? 'uzman' : ''}">${S.sirketler.insaat ? 'Şirket' : S.tamam >= 2 ? 'Kurulabilir' : `${S.tamam}/2`}</span></div></div></section>
    ${Object.keys(S.statu).length ? `<section class="blok"><div class="blok-bas"><h2>Statü</h2></div><div class="liste">${STATU.filter(x => S.statu[x.id]).map(x => `<div class="kv"><span>${x.ad}</span><b class="yildiz">İtibar +${x.itibar}</b></div>`).join('')}</div></section>` : ''}`;
}

function renderFinans(){
  const n = net();
  $('#v-finans').innerHTML = `<h2 class="baslik">Finans</h2>
    <section class="blok"><div class="blok-bas"><h2>Günlük döküm</h2></div>
      <div class="kv"><span>İşletme cirosu</span><b class="iyi">${isaret(toplamGelir())}</b></div>
      <div class="kv"><span>Kira geliri</span><b class="iyi">${isaret(kiraGelir())}</b></div>
      <div class="kv"><span>İşletme giderleri</span><b class="kotu">-${tlk(toplamGider())}</b></div>
      <div class="kv"><span>Yönetim gideri</span><b class="kotu">-${tlk(yonetim())}</b></div>
      ${ceoMaas() ? `<div class="kv"><span>CEO maaşları</span><b class="kotu">-${tlk(ceoMaas())}</b></div>` : ''}
      <div class="kv"><span>Kredi faizi</span><b class="kotu">-${tlk(faiz())}</b></div>
      <hr class="ayrac"><div class="kv"><span>Günlük net</span><b class="${n >= 0 ? 'iyi' : 'kotu'}">${isaret(n)}</b></div>
      <div class="kv"><span>Bu ay kâr (vergi matrahı)</span><b>${tlk(S.ayKar)}</b></div>
      <div class="kv"><span>Aylık enflasyon · fiyat endeksi</span><b>${pct(S.pi)} · ${dec(S.I, 2)}×</b></div></section>
    <div class="ikili"><button class="oyun-btn mercan kucuk" data-git="borsa">Borsa</button><button class="oyun-btn altin kucuk" data-git="yatirim">Altın · Döviz</button><button class="oyun-btn kucuk" data-git="banka">Banka</button><button class="oyun-btn kucuk" data-git="ihale" ${S.st < 2 ? 'disabled' : ''}>İhaleler</button></div>
    <section class="blok"><div class="blok-bas"><h2>Varlıklar</h2></div>
      <div class="kv"><span>Net değer</span><b>${tlk(netDeger())}</b></div>
      <div class="kv"><span>Reel net değer (enflasyondan arındırılmış)</span><b>${tlk(reelND())}</b></div>
      <div class="kv"><span>İşletmeler</span><b>${tlk(isletmeDeger())}</b></div>
      <div class="kv"><span>Projeler ve mülkler</span><b>${tlk(projeDeger())}</b></div>
      <div class="kv"><span>Gram altın (${fmtInt(S.altin)} gr)</span><b>${tlk(S.altin * S.altinFiyat)}</b></div>
      <div class="kv"><span>Dolar (${fmtInt(S.usd)} $)</span><b>${tlk(S.usd * S.usdKur)}</b></div>
      <div class="kv"><span>Hisse senetleri</span><b>${tlk(portfoy())}</b></div>
      <div class="kv"><span>İmar bekleyen tarlalar</span><b>${tlk(tarlaDeger())}</b></div>
      <div class="kv"><span>Borç · faiz ${pct(faizOrani(), 0)}</span><b class="kotu">-${tlk(S.borc)}</b></div></section>
    <section class="blok"><div class="blok-bas"><h2>Sözleşmeler ve dosyalar</h2></div>${S.isler.length ? S.isler.map(j => `<div class="proje"><div class="satir">${ikon(j.tur === 'ihale' ? 'insaat' : j.tur === 'alacak' ? 'perakende' : j.tur === 'tarla' ? 'enerji' : 'saglik')}<div class="ana-metin"><div class="b">${j.ad}</div><div class="s">${j.tur === 'ihale' ? `Sözleşme ${tlk(j.b)}` : j.tur === 'alacak' ? `${tlk(j.tutar)} · %90 tahsil` : j.tur === 'tarla' ? `İmar kararı · ihtimal ${pct(j.p, 0)}` : '%55 ceza ihtimali'} · ${j.kalan} gün</div></div></div><div class="bar ince"><i style="width:${(1 - j.kalan / j.toplam) * 100}%"></i></div></div>`).join('') : '<div class="bos">Açık sözleşme yok.</div>'}</section>
    <section class="blok"><div class="blok-bas"><h2>Defter</h2></div><div class="akis">${S.log.map(l => `<div class="haber ${l.k}"><span class="nokta"></span><span class="g">G${l.g}</span><span class="t">${l.t}</span></div>`).join('')}</div></section>`;
}

function render(){
  renderUst();
  kasaYaz();
  const n = net();
  $('#cipler').innerHTML = `<span class="cipu ${n >= 0 ? 'iyi' : 'kotu'}">${isaret(n)}/gün</span><span class="cipu">Değer ${tlk(netDeger())}</span><span class="cipu yildiz">★ ${Math.round(S.itibar)}</span>`;
  $('#altnav').innerHTML = NAV.map(v => `<button class="${v.id === sekme ? 'on' : ''}" data-sekme="${v.id}" aria-current="${v.id === sekme ? 'page' : 'false'}"><svg viewBox="0 0 24 24" aria-hidden="true">${v.svg}</svg>${v.ad}</button>`).join('');
  for (const v of NAV) $('#v-' + v.id).hidden = v.id !== sekme;
  ({merkez:renderMerkez, sehir:renderSehir, insaat:renderInsaat, sirket:renderSirket, finans:renderFinans})[sekme]();
}

document.addEventListener('click', e => {
  const h = e.target.closest('[data-hiz]'); if (h && !S.iflas){ hizAyarla(+h.dataset.hiz); return; }
  const sk = e.target.closest('[data-sekme]'); if (sk){ sekme = sk.dataset.sekme; try { localStorage.setItem('sh-sekme', sekme); } catch (er) {} window.scrollTo(0, 0); render(); return; }
  const b = e.target.closest('[data-bas]'); if (b){ basamakSheet(+b.dataset.bas); return; }
  const gt = e.target.closest('[data-git]'); if (gt){ GIT[gt.dataset.git](gt.dataset.arg); return; }
  const sa = e.target.closest('[data-subeac]'); if (sa){ const c = sehirBul(sa.dataset.subeac), f = c.sube * S.I; if (S.nakit < f || acikSehirler().length >= B().sehir) return; S.nakit -= f; S.sehirler[c.id] = {endeks:1, degisim:0}; log(`${c.ad} şubesi açıldı: -${tlk(f)}`, 'iyi'); toast(`${c.ad} şubesi açıldı`); ucan('-' + tlk(f), 'kotu'); render(); return; }
  const z = e.target.closest('[data-hizlandir]'); if (z){ const p = S.projeler.find(x => x.id === +z.dataset.hizlandir); if (p) reklam(() => { p.kalan = Math.max(1, Math.ceil(p.kalan / 2)); p.hizli = true; log(`${projeBul(p.tip).ad}: ek vardiya ile hızlandırıldı.`, 'not'); render(); }); return; }
  if (e.target.closest('#gec')){ const sb = BASAMAK[S.st], u = sb.esik * 0.06 * S.I; if (S.nakit < u) return; S.nakit -= u; S.st = sb.n; log(`Ticaret sicil: ${firmaAdi()} tescil edildi. -${tlk(u)}`, 'iyi'); kaydet(); render(); basamakSheet(sb.n); }
});

const KEY = 'sifirdan-holding-demo-v1';
function kaydet(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function yukle(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.gun && s.isletmeler && s.projeler && s.sehirler) return s; } catch (e) {} return null; }
function start(veri){
  S = (veri && veri.S) || yukle();
  if (!S) yeniOyun(1);
  S.teklifler = S.teklifler || []; S.tarlaTeklif = S.tarlaTeklif || []; S.tarlaCd = S.tarlaCd || 0; S.hisse = S.hisse || {}; S.borsa = S.borsa || borsaKur(S.I);
  window.claude?.hot?.snapshot?.(() => ({S}));
  render();
  if (S.iflas) iflasGoster(); else hizAyarla(S.hiz ?? 1);
  requestAnimationFrame(dongu);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
